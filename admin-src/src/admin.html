<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>레인템포랩 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
{{STYLES}}
</head>
<body>

<section id="login" hidden>
  <div class="card" id="login-form">
    <div class="brand"><i></i>레인템포랩 <small>어드민</small></div>
    <h1>로그인</h1>
    <p class="muted">등록된 구글 계정으로 들어옵니다.</p>
    <input type="hidden" id="login-code">
    <button type="button" class="b gbtn" id="login-btn"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>Google로 계속하기</button>
    <p class="muted" id="login-err" style="color:var(--bad);margin-top:10px" hidden></p>
  </div>
</section>

<div id="app" hidden>
  <aside class="sb">
    <div class="brand" id="go-home"><i></i>레인템포랩</div>
    <div class="grp">작업</div>
    <nav id="nav">
      <button data-v="content" class="on"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M5 6h6M5 9h4"/></svg>콘텐츠 제작</button>
      <button data-v="report"><svg viewBox="0 0 16 16"><path d="M2.5 13.5h11M4.5 11V7M8 11V4M11.5 11V8.5"/></svg>월간 보고</button>
      <button data-v="subs"><svg viewBox="0 0 16 16"><circle cx="6" cy="6" r="2.5"/><path d="M1.5 13.5c.6-2.4 2.3-3.5 4.5-3.5s3.9 1.1 4.5 3.5M11 4.5a2 2 0 010 4M12.5 10.5c1 .5 1.7 1.5 2 3"/></svg>구독사</button>
      <button data-v="settings" id="nav-settings" hidden><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>설정</button>
    </nav>
    <a class="b sm ghost" id="open-sheet" target="_blank" rel="noopener" hidden></a>
    <div class="foot"><span class="av" id="av"></span><span class="who" id="who"></span><button class="b sm ghost" id="logout" title="로그아웃">나가기</button></div>
  </aside>
  <main id="view"></main>
</div>

{{DIALOGS}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="fb.js?v={{VER}}"></script>
{{PROFILES}}
{{CARDS}}
{{APP}}
</body>
</html>
