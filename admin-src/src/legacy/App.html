<script>
(() => {
'use strict';

/* ════════════════════ 상태 · 공통 ════════════════════ */
const S = {
  token: null, user: null, boot: null,
  month: '', jobs: [], filter: { client: '', mine: false, stat: '' },
  job: null, tab: 'write', dirty: false, saving: false, pending: false, conflict: null,
  images: [], thumbs: {}, full: {}, homeMode: 'html'
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const PAGE_TYPES = ['표지', '설명', '목록', '표', '사진', '마무리'];
/* 문구 없는 사진형 페이지 */
const NO_TEXT = t => /^사진/.test(String(t || '').trim());

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', bad ? 5000 : 2600);
}
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

function run(fn, args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
/** 서버 호출. 세션이 끝났으면 로그인 후 같은 요청을 다시 보낸다. */
async function api(fn, ...args) {
  try { return await run(fn, [S.token, ...args]); }
  catch (e) {
    const msg = (e && e.message) || String(e);
    if (msg.includes('SESSION_EXPIRED')) { await relogin(); return run(fn, [S.token, ...args]); }
    throw new Error(msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''));
  }
}
function confirmBox(title, html, okText = '확인') {
  const d = $('#dlg-confirm'); $('#cf-title').textContent = title; $('#cf-body').innerHTML = html; $('#cf-ok').textContent = okText;
  d.returnValue = ''; d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true }));
}
function download(name, data, type = 'text/plain;charset=utf-8') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + ' 복사했습니다'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    ok ? toast(label + ' 복사했습니다') : toast('복사가 막혀 있습니다. 파일로 받아주세요.', true);
  }
}
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
const clientIdx = name => Math.max(0, (S.boot?.clients || []).findIndex(c => c.name === name)) % 5;
const clientShort = name => (S.boot?.clients || []).find(c => c.name === name)?.short || name;
const chip = name => `<span class="chip c${clientIdx(name)}">${esc(clientShort(name))}</span>`;
const pill = s => `<span class="pill" data-s="${esc(s)}">${esc(s)}</span>`;
function fmtDay(d) { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth() + 1}/${x.getDate()} (${WD[x.getDay()]})`; }
function monthLabel(m) { const [y, mo] = m.split('-'); return `${y}년 ${Number(mo)}월`; }
function shiftMonth(m, d) { const [y, mo] = m.split('-').map(Number); const x = new Date(y, mo - 1 + d, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`; }

/* ════════════════════ 로그인 ════════════════════ */
let reloginWaiters = null;
function showLogin(msg) {
  $('#login').hidden = false; $('#app').hidden = !S.user;
  if (S.user) { $('#login').style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(246,246,243,.96)'; }
  $('#login-err').hidden = !msg; $('#login-err').textContent = msg || '';
  setTimeout(() => $('#login-code').focus(), 50);
}
function relogin() {
  S.token = null; store('rt.token', null);
  showLogin('로그인 시간이 끝났습니다. 다시 들어오면 작업 중인 내용은 그대로 저장됩니다.');
  return new Promise(res => { (reloginWaiters = reloginWaiters || []).push(res); });
}
$$('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close(b.dataset.close)));
$('#login-code').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });
$('#login-btn').addEventListener('click', () => doLogin());
async function doLogin() {
  const btn = $('#login-btn'); if (btn.disabled) return; btn.disabled = true;
  try {
    const r = await run('login', [$('#login-code').value]);
    $('#login-code').value = '';
    S.token = r.token; store('rt.token', r.token);
    const first = !S.user;
    enter(r.user, r.boot);
    $('#login').hidden = true; $('#login').style.cssText = '';
    if (reloginWaiters) { reloginWaiters.forEach(f => f()); reloginWaiters = null; }
    else if (first) go(S.view || 'content');
  } catch (err) {
    $('#login-err').hidden = false; $('#login-err').textContent = String(err.message || err).replace(/^Error:\s*/, '');
  } finally { btn.disabled = false; }
}
function enter(user, boot) {
  S.user = user; S.boot = boot; window.RTClientProfiles?.setSheet?.(boot.clients);
  if (!S.month) S.month = boot.today.slice(0, 7);
  $('#app').hidden = false;
  $('#who').textContent = user.name + (user.admin ? ' · 관리자' : '');
  const sh = $('#open-sheet'); sh.hidden = !boot.sheetUrl; if (boot.sheetUrl) sh.href = boot.sheetUrl;
}
$('#logout').onclick = async () => { await flush(); S.token = null; S.user = null; store('rt.token', null); location.reload(); };
$('#go-home').onclick = () => go('content');
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
async function go(v) {
  if (S.view === 'report') await flushReport();
  if (S.view === 'subs') await flushSubs();
  S.view = v;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'content') return board();
  const my = ++NAV; await leave(); if (my !== NAV) return; S.job = null;
  return v === 'report' ? reportView() : subsView();
}

async function start() {
  const t = store('rt.token');
  if (t) {
    S.token = t;
    try { const r = await run('whoami', [t]); enter(r.user, r.boot); return go('content'); } catch (e) { S.token = null; store('rt.token', null); }
  }
  showLogin();
}

/* ════════════════════ 보드 (일정) ════════════════════ */
/* 글 종류. 홈페이지 아티클·프로젝트는 CMS 입력값(META)을 extra 에 따로 받는다 */
const KINDS = [['basic', '일반 정보글'], ['event', '경제지표·시의성'], ['article', '홈페이지 아티클'], ['project', '홈페이지 프로젝트']];
const kindLabel = k => (KINDS.find(x => x[0] === k) || KINDS[0])[1];
const isHome = k => k === 'article' || k === 'project';
const CHIP_KIND = { event: '시의성', article: '아티클', project: '프로젝트' };
function progress(j) {
  return [!!j.docUrl, j.imageCount > 0, ['발행 준비', '발행 완료'].includes(j.status), j.status === '발행 완료'];
}
async function leave() {
  await flush();
  const d = S.job?.docState;
  if (S.job && !S.conflict && d?.exists && !d.linked && !d.editedInDocs && d.syncedVersion < S.job.version) {
    $('#view').insertAdjacentHTML('afterbegin', '<div class="note" style="margin-bottom:12px"><span class="spin"></span> 구글 문서에 마지막 수정을 반영하는 중…</div>');
    await syncDoc(false, true);
  }
}
/* 화면 이동 순번: 저장·불러오기를 기다리는 사이 다른 화면을 눌렀으면 늦게 끝난 쪽은 그리지 않는다 */
let NAV = 0;
async function board(reload = true) {
  const my = ++NAV;
  S.view = 'content'; $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === 'content'));
  if (reload) await leave();
  if (my !== NAV) return;
  S.job = null;
  const v = $('#view');
  if (reload) {
    v.innerHTML = '<div class="loading"><span class="spin"></span></div>';
    try { const list = await api('listJobs', S.month); if (my !== NAV) return; S.jobs = list; } catch (e) { if (my === NAV) v.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  }
  const today = S.boot.today, me = S.user.name, f = S.filter;
  const inMonth = S.jobs.filter(j => j.date.slice(0, 7) === S.month);
  const late = S.jobs.filter(j => j.date < today && !['발행 완료', '보류'].includes(j.status));
  const stats = [
    ['today', '오늘 발행', S.jobs.filter(j => j.date === today && j.status !== '발행 완료').length],
    ['late', '지연', late.length],
    ['review', '이미지·편집 대기', S.jobs.filter(j => j.status === '이미지 리서치' || j.status === '디자인 편집').length],
    ['done', '이번 달 발행 완료', `${inMonth.filter(j => j.status === '발행 완료').length}<small style="font-size:14px;color:var(--muted)"> / ${inMonth.length}</small>`]
  ];
  let list = S.jobs.filter(j => (!f.client || j.client === f.client) && (!f.mine || j.owner === me));
  if (f.stat === 'today') list = list.filter(j => j.date === today && j.status !== '발행 완료');
  if (f.stat === 'late') list = list.filter(j => j.date < today && !['발행 완료', '보류'].includes(j.status));
  if (f.stat === 'review') list = list.filter(j => j.status === '이미지 리서치' || j.status === '디자인 편집');
  if (f.stat === 'done') list = list.filter(j => j.status === '발행 완료' && j.date.slice(0, 7) === S.month);
  list.sort((a, b) => a.date.localeCompare(b.date) || a.client.localeCompare(b.client));
  const days = {}; list.forEach(j => (days[j.date] = days[j.date] || []).push(j));

  v.innerHTML = `
  <div class="row" style="margin-bottom:14px">
    <button class="b sm" id="m-prev" aria-label="이전 달">‹</button>
    <h2 style="font-size:20px;letter-spacing:-.02em;min-width:120px;text-align:center">${monthLabel(S.month)}</h2>
    <button class="b sm" id="m-next" aria-label="다음 달">›</button>
    ${S.month !== today.slice(0, 7) ? '<button class="b sm ghost" id="m-now">이번 달</button>' : ''}
    <div class="sp"></div>
    <button class="b" id="csv-open">Canva 월간 파일</button>
    <button class="b pri" id="add">+ 일정 추가</button>
  </div>
  <div class="today">${stats.map(([k, l, n]) => `<div class="stat ${f.stat === k ? 'on' : ''} ${k === 'late' && late.length ? 'alert' : ''}" data-stat="${k}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
  <div class="toolbar">
    <div class="seg" id="cl"><button class="${!f.client ? 'on' : ''}" data-c="">전체</button>${S.boot.clients.map(c => `<button class="${f.client === c.name ? 'on' : ''}" data-c="${esc(c.name)}">${esc(c.short)}</button>`).join('')}</div>
    <label class="row muted" style="gap:6px;cursor:pointer"><input type="checkbox" id="mine" ${f.mine ? 'checked' : ''}> 내 작업만</label>
    ${f.stat ? '<button class="b sm ghost" id="clear-stat">필터 해제</button>' : ''}
  </div>
  ${Object.keys(days).length ? Object.keys(days).map(d => `
    <div class="day"><div class="day-h ${d === today ? 'today-h' : d < today ? 'past' : ''}">${fmtDay(d)}${d === today ? ' · 오늘' : ''}<span class="muted" style="font-weight:500">${days[d].length}건</span></div>
    <div class="jobs">${days[d].map(j => `
      <div class="job" data-id="${esc(j.id)}" tabindex="0">
        <div>${chip(j.client)}</div>
        <div class="t ${j.title ? '' : 'empty'}">${esc(j.title || '주제 미정')}${CHIP_KIND[j.kind] ? ` <span class="chip" style="height:20px;font-size:11px">${CHIP_KIND[j.kind]}</span>` : ''}</div>
        <div class="steps" title="문서 · 이미지 · 검수 · 발행">${progress(j).map(x => `<i class="${x ? 'on' : ''}"></i>`).join('')}</div>
        <div class="o">${esc(j.owner || '')}</div>
        <div>${pill(j.status)}</div>
      </div>`).join('')}</div></div>`).join('')
    : `<div class="jobs"><div class="empty-box">${S.jobs.length ? '조건에 맞는 일정이 없습니다.' : '이번 달 일정이 없습니다.<br><br><button class="b pri" id="add2">+ 한 달 일정 한 번에 등록</button>'}</div></div>`}`;

  $('#m-prev').onclick = () => { S.month = shiftMonth(S.month, -1); board(); };
  $('#m-next').onclick = () => { S.month = shiftMonth(S.month, 1); board(); };
  if ($('#m-now')) $('#m-now').onclick = () => { S.month = today.slice(0, 7); board(); };
  $('#add').onclick = () => openNew('one');
  if ($('#add2')) $('#add2').onclick = () => openNew('bulk');
  $('#csv-open').onclick = openCsv;
  $$('#cl button').forEach(b => b.onclick = () => { S.filter.client = b.dataset.c; board(false); });
  $('#mine').onchange = e => { S.filter.mine = e.target.checked; board(false); };
  $$('.stat').forEach(s => s.onclick = () => { S.filter.stat = S.filter.stat === s.dataset.stat ? '' : s.dataset.stat; board(false); });
  if ($('#clear-stat')) $('#clear-stat').onclick = () => { S.filter.stat = ''; board(false); };
  $$('.job').forEach(r => { r.onclick = () => openJob(r.dataset.id); r.onkeydown = e => { if (e.key === 'Enter') openJob(r.dataset.id); }; });
}

/* ── 일정 추가 ── */
const F = n => $(`#new-form [name=${n}]`);
function fillSelect(sel, items, value) { sel.innerHTML = items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); if (value !== undefined) sel.value = value; }
function openNew(mode) {
  const d = $('#dlg-new'), fm = $('#new-form');
  fillSelect(F('client'), S.boot.clients.map(c => [c.name, c.name]), S.filter.client || S.boot.clients[0]?.name);
  fillSelect(F('owner'), [['', '미정'], ...S.boot.staff.map(s => [s, s])], S.user.name);
  F('date').value = S.boot.today; F('month').value = S.month; F('title').value = ''; F('topics').value = '';
  if (!$('#wd').children.length) $('#wd').innerHTML = WD.map((w, i) => `<label><input type="checkbox" value="${i}" ${[1, 4].includes(i) ? 'checked' : ''}><span>${w}</span></label>`).join('');
  setMode(mode); d.returnValue = ''; d.showModal();
}
function setMode(m) {
  $$('#new-mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('#new-form [data-m]').forEach(x => { if (x.tagName !== 'BUTTON') x.hidden = x.dataset.m !== m; });
  $('#new-form').dataset.mode = m; bulkPreview();
}
$$('#new-mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));
function bulkDates() {
  const fm = $('#new-form'); const [y, m] = (F('month').value || S.month).split('-').map(Number);
  const wd = $$('#wd input:checked').map(x => Number(x.value)); const out = [];
  for (let d = 1; d <= 31; d++) { const x = new Date(y, m - 1, d); if (x.getMonth() !== m - 1) break; if (wd.includes(x.getDay())) out.push(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`); }
  return out;
}
function bulkPreview() {
  const fm = $('#new-form'); if (fm.dataset.mode !== 'bulk') return;
  const dates = bulkDates(), topics = F('topics').value.split('\n').map(s => s.trim()).filter(Boolean);
  $('#bulk-sum').textContent = `${dates.length}건 등록 예정 · 주제 ${topics.length}개 입력됨${topics.length > dates.length ? ' (날짜보다 많은 주제는 제외됩니다)' : ''}`;
  $('#bulk-list').innerHTML = dates.map((d, i) => `<div><input type="date" value="${d}" data-i="${i}" class="bd"><input type="text" value="${esc(topics[i] || '')}" placeholder="주제 미정" class="bt"><button type="button" class="b sm ghost bx" title="빼기">✕</button></div>`).join('');
  $$('#bulk-list .bx').forEach(b => b.onclick = () => { b.parentElement.remove(); $('#bulk-sum').textContent = `${$$('#bulk-list > div').length}건 등록 예정`; });
}
['change', 'input'].forEach(ev => { F('month').addEventListener(ev, bulkPreview); F('topics').addEventListener(ev, bulkPreview); $('#wd').addEventListener(ev, bulkPreview); });
$('#dlg-new').addEventListener('close', async () => {
  if ($('#dlg-new').returnValue !== 'ok') return;
  const fm = $('#new-form'), base = { client: F('client').value, owner: F('owner').value };
  let items;
  if (fm.dataset.mode === 'bulk') items = $$('#bulk-list > div').map(r => ({ ...base, date: $('.bd', r).value, title: $('.bt', r).value.trim(), kind: F('bkind').value || 'basic' })).filter(x => x.date);
  else items = [{ ...base, date: F('date').value, title: F('title').value.trim(), kind: F('kind').value }];
  if (!items.length) return toast('등록할 날짜가 없습니다.', true);
  try {
    const made = await api('createJobs', items);
    toast(`${made.length}건을 등록했습니다`);
    if (made.length === 1 && fm.dataset.mode === 'one') openJob(made[0].id); else { S.month = items[0].date.slice(0, 7); board(); }
  } catch (e) { toast(e.message, true); }
});

/* ── 월간 CSV ── */
let csvRows = [];
function openCsv() {
  fillSelect($('#csv-client'), S.boot.clients.map(c => [c.name, c.name]), S.filter.client || S.boot.clients[0]?.name);
  $('#dlg-csv').showModal(); loadCsv();
}
async function loadCsv() {
  $('#csv-sum').textContent = '불러오는 중…'; csvRows = [];
  try { csvRows = await api('exportImagePlan', $('#csv-client').value, S.month); } catch (e) { $('#csv-sum').textContent = e.message; return; }
  const types = [...new Set(csvRows.map(r => r.type).filter(Boolean))];
  fillSelect($('#csv-type'), [['', '전체 유형'], ...types.map(t => [t, t])]);
  csvSum();
}
/** 한 달 치 계획을 글 단위로 묶는다 */
function monthSets() {
  const sets = [], idx = {};
  csvRows.forEach(r => { const k = r.date + '|' + r.topic; if (!(k in idx)) { idx[k] = sets.length; sets.push({ date: r.date, topic: r.topic, pages: [] }); } sets[idx[k]].pages.push(r); });
  return sets;
}
function monthTable() {
  if ($('#csv-mode').value === 'set') return setTable(monthSets().map(x => x.pages));
  const t = $('#csv-type').value; return singleTable(csvRows.filter(r => !t || r.type === t));
}
function csvSum() {
  const set = $('#csv-mode').value === 'set'; $('#csv-type-wrap').hidden = set;
  if (!csvRows.length) { $('#csv-sum').textContent = `${monthLabel(S.month)}: 이미지 계획이 입력된 글이 없습니다.`; return; }
  if (set) {
    const sets = monthSets(), n = Math.max(...sets.map(x => x.pages.length));
    $('#csv-sum').textContent = `${sets.length}행 → Canva 디자인 ${sets.length}개. 열: 1_제목, 1_본문 … ${n}_제목, ${n}_본문\n템플릿의 1페이지 글상자에 1_열, 2페이지에 2_열을 연결합니다.\n\n생성 순서\n` + sets.map((x, i) => `${i + 1}. ${fmtDay(x.date)} ${x.topic || '주제 미정'} (${x.pages.length}장)`).join('\n');
  } else {
    const t = $('#csv-type').value, rows = csvRows.filter(r => !t || r.type === t);
    $('#csv-sum').textContent = `${rows.length}행 → Canva 디자인 ${rows.length}개 (열: 제목, 본문)\n유형을 하나로 골라야 한 페이지 템플릿에 맞습니다.\n\n생성 순서\n` + rows.map((r, i) => `${i + 1}. ${fmtDay(r.date)} ${r.topic} ${r.n}번`).join('\n');
  }
}
$('#csv-client').onchange = loadCsv; $('#csv-type').onchange = csvSum; $('#csv-mode').onchange = csvSum;
const monthName = ext => `${safeName(clientShort($('#csv-client').value))}_${S.month}_Canva대량제작.${ext}`;
$('#csv-go').onclick = () => { if (!csvRows.length) return toast('받을 내용이 없습니다.', true); download(monthName('csv'), csv(monthTable()), 'text/csv;charset=utf-8'); };
$('#xlsx-go').onclick = async () => { if (!csvRows.length) return toast('받을 내용이 없습니다.', true); download(monthName('xlsx'), await xlsx(monthTable())); };

/* ── Canva 대량 제작 표 ──
 * Canva 는 파일의 한 행마다 템플릿 전체를 복제한다. 그래서
 * 세트: 한 행 = 글 1편, 열 = 페이지별 제목·본문 (1_제목, 1_본문, 2_제목 …)
 * 한 장: 한 행 = 이미지 1장, 열 = 제목·본문
 * 번호·유형·alt 같은 열은 넣지 않는다 (자동 연결이 엉뚱한 글상자에 붙는다). */
function setTable(sets) {
  // 사진 페이지와 모든 글에서 비어 있는 페이지는 열을 만들지 않는다. 열 이름은 템플릿 페이지 번호 그대로.
  const n = Math.max(1, ...sets.map(p => p.length)), cols = [];
  for (let i = 0; i < n; i++) if (sets.some(p => p[i] && !NO_TEXT(p[i].type) && (p[i].title || p[i].body))) cols.push(i);
  const head = []; cols.forEach(i => head.push((i + 1) + '_제목', (i + 1) + '_본문'));
  return [head, ...sets.map(p => { const r = []; cols.forEach(i => { const x = p[i] && !NO_TEXT(p[i].type) ? p[i] : {}; r.push(x.title || '', x.body || ''); }); return r; })];
}
function singleTable(items) { return [['제목', '본문'], ...items.filter(i => !NO_TEXT(i.type) && (i.title || i.body)).map(i => [i.title || '', i.body || ''])]; }
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? '').replace(/\r/g, ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
function colName(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
/** 줄바꿈을 그대로 담는 최소 XLSX (외부 라이브러리 없이 JSZip 으로) */
async function xlsx(rows) {
  const xe = v => String(v ?? '').replace(/\r/g, '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const NS = 'http:' + '/' + '/schemas.openxmlformats.org/';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const z = new JSZip();
  z.file('[Content_Types].xml', head + '<Types xmlns="' + NS + 'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  z.file('_rels/.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml', head + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets><sheet name="Canva" sheetId="1" r:id="rId1"/></sheets></workbook>');
  z.file('xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml', head + '<styleSheet xmlns="' + NS + 'spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  const body = rows.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((v, ci) => '<c r="' + colName(ci) + (ri + 1) + '" t="inlineStr" s="1"><is><t xml:space="preserve">' + xe(v) + '</t></is></c>').join('') + '</row>').join('');
  z.file('xl/worksheets/sheet1.xml', head + '<worksheet xmlns="' + NS + 'spreadsheetml/2006/main"><cols><col min="1" max="' + Math.max(1, rows[0].length) + '" width="28" customWidth="1"/></cols><sheetData>' + body + '</sheetData></worksheet>');
  return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ── 필드 바인딩 · 자동 저장 ── */
const META = ['title', 'date', 'kind', 'owner', 'status', 'blogUrl', 'webUrl', 'folderUrl'];
function getVal(k) { return META.includes(k) ? S.job[k] : B()[k]; }
function setVal(k, v) { if (META.includes(k)) S.job[k] = v; else B()[k] = v; }
function bindFields(root) {
  $$('[data-k]', root).forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = !!getVal(k); else if (el.value === '' && getVal(k)) el.value = getVal(k);
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      setVal(k, el.type === 'checkbox' ? el.checked : el.value);
      touched(k);
    });
  });
}
function touched(k) {
  S.dirty = true; saveState('dirty');
  if (S.job.status === '예정' && ['blog', 'web', 'webHtml', 'brief', 'images'].includes(k)) { S.job.status = '원고 작성'; if ($('#status')) $('#status').value = '원고 작성'; }
  /* 수동 저장: 저장 버튼 · ⌘S · 상태 변경 · 일정으로 나갈 때 저장한다. 깜빡해도 90초 뒤 한 번 저장 */
  clearTimeout(touched.t);
  if (k === 'status') save(); else touched.t = setTimeout(save, 90000);
  if (['kind'].includes(k) && S.tab === 'write') renderTab();
  else { renderSide(); liveUpdate(k); }
}
function saveState(s, extra) {
  const el = $('#save-state'); if (!el) return;
  el.className = 'save ' + (s === 'dirty' ? 'dirty' : s === 'err' ? 'err' : '');
  el.textContent = s === 'dirty' ? '저장 안 됨' : s === 'saving' ? '저장 중…' : s === 'err' ? '저장 실패 · ' + extra : `저장됨 · v${S.job.version}`;
  const btn = $('#save-btn'); if (btn) { btn.disabled = !(s === 'dirty' || s === 'err'); btn.classList.toggle('pri', s === 'dirty' || s === 'err'); }
}
function patch() {
  const p = {}; META.forEach(k => p[k] = S.job[k] ?? '');
  ['brief', 'source', 'releaseAt', 'confirmedAt', 'publishTime', 'blog', 'web', 'webHtml', 'images', 'notes', 'reviewed', 'designUrl', 'history', 'extra', 'cards'].forEach(k => { if (B()[k] !== undefined) p[k] = B()[k]; });

}
async function save() {
  if (!S.job || !S.dirty || S.conflict) return;

  S.saving = true; S.dirty = false; saveState('saving');
  const job = S.job;
  try {
    const r = await api('saveJob', job.id, patch(), job.version);
    if (job !== S.job) return;
    if (r.conflict) { S.dirty = true; S.conflict = r; showConflict(); saveState('err', '다른 사람이 먼저 저장'); return; }
    job.version = r.version; job.docState = r.docState || job.docState; saveState(S.dirty ? 'dirty' : 'ok'); renderSide(); scheduleDoc();
  } catch (e) { S.dirty = true; saveState('err', e.message); toast('저장하지 못했습니다: ' + e.message, true); }

}
async function flush() {
  clearTimeout(touched.t); clearTimeout(scheduleDoc.t);

}

/* ── 검사 ── */
const LINT = [
  [/[—–]/g, '줄표(—)는 쉼표나 마침표로 바꿔주세요.'],
  [/[가-힣]+[이가]\s?아니라|[가-힣]+[이가]\s?아닌\s/g, '‘A가 아닌 B’ 대비 표현입니다. 꼭 필요한지 확인해주세요.'],
  [/의\s?결(?=[을이은과에도\s.,]|$)/g, '추상적인 ‘~의 결’ 표현입니다. 구체적으로 바꿔주세요.'],
  [/\p{Extended_Pictographic}/gu, '장식 이모지를 빼주세요.'],
  [/중대한 전환점|새로운 지평|본질을 꿰뚫|당신의 여정|전환점|해자|척추|등뼈/g, '과장되거나 추상적인 표현입니다.'],
  [/로 본다|붙는다|흐름/g, '사내 금지어(로 본다 · 붙는다 · 흐름)입니다.'],
  [/(?<![가-힣])[축결](?![가-힣])/g, '사내 금지어(축 · 결)입니다.'],
  [/\{\{[^}]+\}\}|\[본사 확인 후 게시\]|\[확인 필요\]|TODO/g, '미완성 자리표시가 남아 있습니다.']
];
function lint() {
  const src = [['제목', S.job.title], ['블로그', B().blog], ['홈페이지', S.homeMode === 'html' ? B().webHtml : B().web], ['이미지', (B().images || []).map(i => [i.title, i.body, i.alt].join(' ')).join('\n')]];
  const out = [];
  /* 고객사별로 자꾸 따라 나오는 옛 표현 */
  const ck = window.RTClientProfiles?.key?.(S.job.client) || (String(S.job.client).includes('쓸닥') ? '쓸닥' : '');
  const extraLint = ck === '쓸닥' ? [[/(?:인천|서울|수도권)?\s*기점\s*\d+\s*km|\d+\s*km\s*(?:이내|안|반경)?/gi, "쓸닥 서비스 권역은 '서울·인천·경기 수도권'으로 씁니다 (거리 표기 삭제)"]] : [];
  [...LINT, ...extraLint].forEach(([re, msg]) => {
    const hits = [];
    src.forEach(([where, text]) => { const t = String(text || '').replace(/<[^>]+>/g, ' '); for (const m of t.matchAll(re)) { if (hits.length < 3) hits.push(`${where}: …${esc(t.slice(Math.max(0, m.index - 12), m.index))}<mark>${esc(m[0])}</mark>${esc(t.slice(m.index + m[0].length, m.index + m[0].length + 12))}…`); } });
    if (hits.length) out.push(`<b>${msg}</b><br>${hits.join('<br>')}`);
  });
  const li = linkIssues(S.homeMode === 'html' ? B().webHtml : '');
  if (li.length) out.unshift(`<b>링크를 고쳐주세요</b><br>${li.map(esc).join('<br>')}`);
  const th = S.homeMode === 'html' ? themeIssue(B().webHtml) : '';
  if (th) out.unshift(`<b>홈페이지 색상을 고쳐주세요</b><br>${esc(th)}. 홈페이지 칸의 '${isDark(clientBg()) ? '어두운' : '밝은'} 바탕으로' 버튼을 누르세요.`);
  return out;
}
function kstMs(s) { return s ? Date.parse(s + ':00+09:00') : NaN; }
function timing() {
  const j = S.job, b = B();
  if (j.kind !== 'event') return null;
  const rel = kstMs(b.releaseAt), pub = kstMs(j.date + 'T' + (b.publishTime || '09:00')), conf = kstMs(b.confirmedAt), now = Date.now();
  if (!Number.isFinite(rel)) return ['warn', '발표 예정 시각(한국시간)을 입력해주세요.'];
  if (pub < rel) return ['', '발표 전에 발행합니다. 실제 결과 수치를 쓰지 말고 개념과 확인할 항목을 설명해주세요.'];
  if (now < rel) return ['', '아직 발표 전입니다. 발표 후 공식 자료를 확인하고 원고를 갱신해주세요.'];
  if (!/^https:\/{2}/.test(b.source || '') || !Number.isFinite(conf) || conf < rel) return ['warn', '발표 시각이 지났습니다. 공식 출처 링크와 실제 확인 시각을 기록해주세요.'];
  return ['good', '공식 자료 확인이 기록됐습니다. 발행 직전 수정 발표가 없는지 한 번 더 확인해주세요.'];
}

/* ── 홈페이지 이미지 자리: 계획한 이미지 수만큼, 본문 곳곳에 ──
   AI 가 자리를 덜 만들거나 글 끝에 몰아 두면 직원이 남는 이미지를 글 맨 아래에 붙이게 되고
   alt 가 파일명(5.png)으로 남는다. 적용할 때와 버튼으로 자리를 채우고 흩어 놓는다. */
const PH_RE = /rtadmin-placeholder\.invalid\/image-(\d+)/;
const badAltText = a => !String(a || '').trim() || /\.(png|jpe?g|webp|gif)$/i.test(a) || /^(image|img|이미지)\s*\d*$/i.test(String(a).trim());
function slotsOff() { return window.RTClientProfiles?.get(S.job?.client)?.imageSlots === false; }
function placeSlots(html, imgs, ALL) {
  const res = { html, added: [], moved: [], alts: 0 };
  const N = (imgs || []).length;
  if (!N || !String(html || '').trim()) return res;
  const doc = new DOMParser().parseFromString(`<div id="rt-root">${html}</div>`, 'text/html');
  const root = doc.getElementById('rt-root');
  const altOf = n => (imgs[n - 1] && (imgs[n - 1].alt || [imgs[n - 1].title, imgs[n - 1].body].filter(Boolean).join(' ').replace(/\n/g, ' '))) || '';
  /* 이미지 하나만 감싼 p·figure·div 는 묶어서 옮긴다 */
  const blockOf = img => { let b = img; while (b.parentElement && b.parentElement !== root && /^(P|FIGURE|DIV|A|SPAN|PICTURE)$/.test(b.parentElement.tagName) && !b.parentElement.textContent.trim() && b.parentElement.querySelectorAll('img').length === 1) b = b.parentElement; return b; };
  const meaningful = n => n.nodeType === 3 ? !!n.textContent.trim() : n.nodeType === 1 && !!(n.textContent.trim() || n.querySelector('table,iframe,video'));
  const at = new Map();
  root.querySelectorAll('img').forEach(img => { const m = (img.getAttribute('src') || '').match(PH_RE); if (m && !at.has(+m[1])) at.set(+m[1], img); });
  /* alt 채우기 */
  at.forEach((img, n) => { if (n <= N && badAltText(img.getAttribute('alt')) && altOf(n)) { img.setAttribute('alt', altOf(n)); res.alts++; } });
  /* 바로 앞이 다른 이미지 자리인 것 = 몰려 있는 것 */
  const prevMeaning = el => { let p = el; for (;;) { if (p.previousSibling) { p = p.previousSibling; if (p.nodeType === 1 && p.querySelector && (p.tagName === 'IMG' || p.querySelector('img')) && !p.textContent.trim()) return p; if (meaningful(p)) return p; } else { p = p.parentNode; if (!p || p === root) return null; } } };
  const isPhBlock = el => el && el.nodeType === 1 && !el.textContent.trim() && [el, ...el.querySelectorAll('img')].some(x => x.tagName === 'IMG' && PH_RE.test(x.getAttribute('src') || ''));
  const relocate = new Set();
  const heads0 = [...root.querySelectorAll('h2,h3')], lastHead = heads0[heads0.length - 1];
  const nums = [...at.keys()].filter(n => n <= N).sort((a, b) => a - b);
  nums.forEach(n => {
    const blk = blockOf(at.get(n));
    if (isPhBlock(prevMeaning(blk))) relocate.add(n);
    /* 마지막 소제목 뒤(글 끝)에서 이미지가 줄지어 붙어 있으면 첫 장까지 옮긴다 */
    else if (lastHead && before(lastHead, blk) && nums.some(m => m !== n && prevMeaning(blockOf(at.get(m))) === blk)) relocate.add(n);
  });
  for (let n = 1; n <= N; n++) if (!at.has(n)) relocate.add(n);
  /* 남은 자리로 고르게 못 나누면 전부 다시 배치한다 */
  if (ALL) for (let n = 1; n <= N; n++) relocate.add(n);
  if (!relocate.size) { res.html = res.alts ? root.innerHTML : html; return res; }
  const relocBlocks = new Set([...relocate].filter(n => at.has(n)).map(n => blockOf(at.get(n))));
  /* 옮길 이미지는 먼저 빼 두고 남은 글을 기준으로 자리를 고른다 */
  relocBlocks.forEach(bk => bk.remove());

    const lab = { '제목': 'cmsTitle', '슬러그': 'slug', '설명': 'meta', '태그': 'tags', '배너 서브타이틀': 'subtitle', 'type': 'ptype', 'milestone': 'milestone', 'client': 'client', 'link url': 'linkUrl', 'link 텍스트': 'linkText' }, o = {};
    m[2].split('\n').forEach(l => { const p = l.replace(/<[^>]+>/g, '').match(/^\s*([^:：]{1,20})[:：]\s*(.*)$/); const k = p && lab[p[1].trim().toLowerCase()]; if (k && p[2].trim()) o[k] = p[2].trim(); });
    return { o, at: m.index }; };
  const tail = String(raw || '').slice(String(raw || '').lastIndexOf('}') + 1), mt = metaFrom(tail), mh = metaFrom(webHtml);
  if (mh) { webHtml = webHtml.slice(0, mh.at).replace(/<p>\s*$/i, '').trimEnd(); }
  const mo = { ...(mh?.o || {}), ...(mt?.o || {}) };
  if (Object.keys(mo).length) { for (const [k, v] of Object.entries(mo)) if (!extra[k]) extra[k] = v; fixes.push('META 블록 → 발행 정보'); }
  const notes = pick(x, AI_KEYS.reviewNotes);
  return { title: String(pick(x, AI_KEYS.title) || ''), blog, web, webHtml, images, reviewNotes: Array.isArray(notes) ? notes.join('\n') : String(notes || ''), extra, fixes };
}

/* ════════════════════ 쓸닥 SD 원고 문서 읽기 ════════════════════
 * 형식: 첫 줄 [SD-코드] 제목 · 메타 표(타깃 키워드, 홈페이지 슬러그, 메타 설명 …)
 * 1. 네이버 블로그 SD-…-B · 2. 홈페이지 게시판 SD-…-H · 3. 인스타그램 카드뉴스 SD-…-I · 4. FAQ */
function parseSdDoc(raw) {
  /* 구글 문서의 줄 안 줄바꿈(Shift+Enter)은 \r 또는 \v 로 들어오므로 모두 \n 으로 맞춘다 */
  const text = String(raw || '').replace(/\r\n/g, '\n').replace(/[\r\u000b\u2028]/g, '\n').replace(/\u00a0/g, ' ');
  /* 채팅 답변을 그대로 복사하면 마크다운 기호가 섞이므로 걷어낸다 */
  const lines = text.split('\n').map(l => l.replace(/^\s*#{1,6}\s+/, '').replace(/^\s*>\s?/, '').replace(/\*\*/g, '').replace(/\\([\[\]().#*_>|-])/g, '$1'));
  const find = (re, from = 0) => { for (let i = Math.max(0, from); i < lines.length; i++) if (re.test(lines[i].trim())) return i; return -1; };
  const head = w => new RegExp('^(\\d+[.)]\\s*)?' + w);
  const iBlog = find(head('네이버\\s*블로그')), iWeb = find(head('홈페이지\\s*(게시판|원고)')), iInsta = find(head('인스타(그램)?\\s*카드\\s*뉴스'));
  if ([iBlog, iWeb, iInsta].filter(i => i >= 0).length < 2) return null;
  const iFaq = find(/^\d*\.?\s*FAQ/, Math.max(iBlog, iWeb, iInsta));
  const stop = (...xs) => { const v = xs.filter(i => i >= 0); return v.length ? Math.min(...v) : lines.length; };
  const meta = k => { const m = text2.match(new RegExp(k + '[ \\t]*[\\t\\n][ \\t]*([^\\n\\t]+)')); return m ? m[1].trim() : ''; };
  const first = (lines.find(l => l.trim()) || '').trim();
  const text2 = lines.join('\n');
  const code = (text2.match(/\b(SD-[A-Z]+\d+)\b/) || [])[1] || '';
  let blog = '', titles = [];
  if (iBlog >= 0) {
    const s = find(/^본문\s*[—–-]/, iBlog), t0 = find(/^제목안/, iBlog);
    blog = lines.slice(s >= 0 ? s + 1 : iBlog + 1, stop(iWeb, iInsta, iFaq)).join('\n').trim();
    if (t0 >= 0 && s > t0) titles = lines.slice(t0 + 1, s).map(x => x.trim().replace(/^\d+[.)]\s*/, '')).filter(Boolean);
  }
  let webHtml = '', webTitle = '', category = '';
  if (iWeb >= 0) {
    const seg = lines.slice(iWeb + 1, stop(iInsta, iFaq));
    const m = seg.join('\n').match(/제목은\s*(.+?),\s*분류는\s*(.+?)입니다/);
    /* HTML 은 코드 블록(```)으로 감싸져 올 수 있다 */
    for (let i = 0; i < seg.length; i++) if (/^\s*```/.test(seg[i])) seg[i] = '';
    if (m) { webTitle = m[1].trim(); category = m[2].trim(); }
    const a = seg.findIndex(l => l.trim().startsWith('<')); let z = -1;
    seg.forEach((l, i) => { if (l.trim().endsWith('>')) z = i; });
    if (a >= 0 && z >= a) webHtml = seg.slice(a, z + 1).join('\n').trim();
  }
  const cards = []; const cap = [], tags = [];
  if (iInsta >= 0) {
    let cur = null, mode = 'card';
    const flush = () => { if (cur) cards.push(cur); cur = null; };
    for (const line of lines.slice(iInsta + 1, stop(iFaq))) {
      const l = line.trim();
      if (/^\[캡션\]/.test(l)) { flush(); mode = 'cap'; continue; }
      if (/^\[해시태그\]/.test(l)) { flush(); mode = 'tag'; continue; }
      if (mode === 'cap') { cap.push(line); continue; }
      if (mode === 'tag') { if (l) tags.push(l); continue; }
      const h = l.match(/^\[(카드[^\]]*|마지막\s*카드)\]\s*(.*)$/);
      if (h) { flush(); cur = { head: h[1], title: h[2].trim(), lines: [] }; continue; }
      if (cur && l) cur.lines.push(l);
    }
    flush();
  }
  const images = [];
  cards.forEach((c, i) => {
    const cover = i === 0 || /커버/.test(c.head), last = /마지막/.test(c.head);
    let t = c.title, body = c.lines;
    if (!t) { t = body[0] || ''; body = body.slice(1); }
    if (cover) t = twoLines(t);
    const item = { type: cover ? '표지' : last ? '마무리' : '설명', title: t, body: body.join('\n'), alt: (t.replace(/\n/g, ' ') + (body.length ? ' · ' + body.join(' ') : '')).slice(0, 90) };
    /* [카드 N] 은 N번째 자리에 둔다. 빈 번호는 사진 페이지로 채운다 */
    const n = Number((c.head.match(/카드\s*(\d+)/) || [])[1]);
    if (n && !last) { while (images.length < n - 1) images.push({ type: '사진', title: '', body: '', alt: '' }); images[n - 1] = item; }
    else images.push(item);
  });
  for (let i = 0; i < images.length; i++) if (!images[i]) images[i] = { type: '사진', title: '', body: '', alt: '' };
  return {
    title: webTitle || first.replace(/^\[[^\]]+\]\s*/, ''), blog, webHtml, images,
    extra: { code, titles, keyword: [meta('타깃 키워드'), ...meta('보조 키워드').split(/\s*[·,，、\/]\s*/)].map(x => x.replace(/\*/g, '').trim()).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(', '), slug: meta('홈페이지 슬러그'), meta: meta('메타 설명'), category, caption: cap.join('\n').trim(), hashtags: tags.join(' ') }
  };
}
/* 커버 제목은 두 줄: 줄바꿈이 없으면 가운데에 가까운 띄어쓰기에서 나눈다 */
function twoLines(t) {
  t = String(t || '').trim();
  if (t.includes('\n') || t.length < 9) return t;
  const sp = [...t.matchAll(/ /g)].map(m => m.index); if (!sp.length) return t;
  const mid = t.length / 2, k = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
  return t.slice(0, k) + '\n' + t.slice(k + 1);
}

}

  const v = $('#view');
  if (!R.month) R.month = lastMonth();
  v.innerHTML = '<div class="loading"><span class="spin"></span></div>';
  try { [R.subs, R.data] = await Promise.all([api('listSubscribers'), api('getManual', R.month)]); }
  catch (e) { v.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  const active = R.subs.filter(s => s.status !== 'paused');
  const d = R.data, get = (sec, id, f) => d?.[sec]?.[id]?.[f];
  const cells = s => MSEC.filter(m => m[3](s)).reduce((n, m) => n + m[2].length, 0) + 1;
  const filled = s => MSEC.filter(m => m[3](s)).reduce((n, [sec, , fs]) => n + fs.filter(f => get(sec, s.id, f) != null).length, 0) + (d?.comments?.[s.id] ? 1 : 0);
  const total = active.reduce((n, s) => n + cells(s), 0), done = active.reduce((n, s) => n + filled(s), 0);
  v.innerHTML = `
  <div class="row" style="margin-bottom:14px">
    <button class="b sm" id="r-prev">‹</button>
    <h2 style="font-size:20px;letter-spacing:-.02em;min-width:120px;text-align:center">${monthLabel(R.month)} 보고</h2>
    <button class="b sm" id="r-next">›</button>
    <div class="sp"></div><span class="save" id="r-save">${d._meta ? `저장됨 · ${esc(d._meta.updatedAt)}${d._meta.updatedBy ? ' · ' + esc(d._meta.updatedBy) : ''}` : '아직 입력 없음'}</span>
  </div>
  <div class="note" style="margin-bottom:14px">자동화되지 않는 수치를 넣는 곳입니다. 칸마다 자동 저장되고, 여러 명이 동시에 넣어도 서로 지우지 않습니다. 입력 ${done}/${total}칸.
    대시보드에는 대표 컴퓨터에서 <b>python3 scripts/sync_webapp.py</b> 후 대시보드 빌드를 돌리면 반영됩니다.</div>
  <div class="seg" id="r-jump" style="margin-bottom:12px;flex-wrap:wrap">${active.map(s => `<button data-id="${esc(s.id)}">${esc(s.name)} <span class="count">${filled(s)}/${cells(s)}</span></button>`).join('')}</div>
  ${active.map(s => `
  <div class="card" id="rc-${esc(s.id)}">
    <div class="row"><h3>${esc(s.name)}</h3><span class="count">${esc(s.goal || '')}</span></div>
    ${MSEC.filter(m => m[3](s)).map(([sec, label, fs]) => `
      <div class="muted" style="font-weight:700;margin:14px 0 6px">${label}</div>
      <div class="grid g4">${fs.map(f => `<label class="f"><span>${f}</span><input type="text" inputmode="decimal" data-p="${sec}|${esc(s.id)}|${f}" value="${get(sec, s.id, f) ?? ''}" placeholder="-"></label>`).join('')}</div>`).join('')}
    <label class="f" style="margin-top:14px"><span>이번 달 전략 코멘트 (대시보드에 표시)</span><textarea rows="3" data-p="comments|${esc(s.id)}" placeholder="이번 달 성과 요약과 다음 달 전략">${esc(d?.comments?.[s.id] || '')}</textarea></label>
    <label class="f" style="margin-top:10px"><span>운영계획서 링크</span><input type="url" data-p="plan_links|${esc(s.id)}" value="${esc(d?.plan_links?.[s.id] || '')}" placeholder="https:\/\/docs.google.com/document/d/... (보기 권한 공유 필수)"></label>
  </div>`).join('') || '<div class="card empty-box">구독사 탭에 등록된 구독사가 없습니다.</div>'}`;
  $('#r-prev').onclick = async () => { await flushReport(); R.month = shiftMonth(R.month, -1); reportView(); };
  $('#r-next').onclick = async () => { await flushReport(); R.month = shiftMonth(R.month, 1); reportView(); };
  $$('#r-jump button').forEach(b => b.onclick = () => $('#rc-' + b.dataset.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  $$('[data-p]', v).forEach(el => el.addEventListener('input', () => {
    const path = el.dataset.p.split('|'); let val = el.value.trim();
    if (path.length === 3) { val = val.replace(/,/g, ''); if (val !== '' && !Number.isFinite(Number(val))) { el.style.borderColor = 'var(--bad)'; return; } el.style.borderColor = ''; val = val === '' ? null : Number(val); }
    else if (val === '') val = null;
    R.queue = R.queue.filter(q => q.path.join('|') !== path.join('|')); R.queue.push({ path, value: val });
    $('#r-save').className = 'save dirty'; $('#r-save').textContent = '저장 대기…';
    clearTimeout(R.t); R.t = setTimeout(flushReport, 800);
  }));
}
async function flushReport() {
  clearTimeout(R.t);
  while (R.saving) await new Promise(r => setTimeout(r, 120));
  if (!R.queue.length) return;
  const batch = R.queue; R.queue = []; R.saving = true;
  try { const r = await api('saveManual', R.month, batch); if ($('#r-save')) { $('#r-save').className = 'save'; $('#r-save').textContent = `저장됨 · ${r.at}`; } }
  catch (e) { R.queue = batch.concat(R.queue); if ($('#r-save')) { $('#r-save').className = 'save err'; $('#r-save').textContent = '저장 실패'; } toast('저장하지 못했습니다: ' + e.message, true); }
  finally { R.saving = false; }
}

/* ════════════════════ 구독사 관리 ════════════════════ */
const SUB_FIELDS = [
  ['name', '구독사명', '예: 컬쳐캐피탈 VIP지점'], ['goal', '목표(전환)', '예: 아임웹 홈페이지 문의'],
  ['imweb_url', '아임웹 사이트 주소', 'https:\/\/'], ['gsc_property', '서치콘솔 속성', 'sc-domain:example.com 또는 https:\/\/example.com/'],
  ['ga4_property_id', 'GA4 속성 ID', '숫자만'], ['naver_blog_url', '네이버 블로그 주소', 'https:\/\/blog.naver.com/아이디'],
  ['instagram', '인스타그램 계정', '@계정명']
];
const CHANNELS = [['imweb_posts', '아임웹 게시글'], ['imweb_magazine', '아임웹 매거진'], ['naver_blog', '네이버 블로그'], ['instagram', '인스타그램']];
const SB = { list: [], dirty: new Set(), t: null };
async function subsView() {
  const v = $('#view');
  v.innerHTML = '<div class="loading"><span class="spin"></span></div>';
  try { SB.list = await api('listSubscribers'); } catch (e) { v.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  renderSubs();
}
function renderSubs() {
  const v = $('#view');
  v.innerHTML = `
  <div class="row" style="margin-bottom:14px"><h2 style="font-size:20px;letter-spacing:-.02em">구독사 관리</h2><span class="save" id="s-save" style="margin-left:8px"></span><div class="sp"></div><button class="b pri" id="s-add">+ 구독사 추가</button></div>
  <div class="note" style="margin-bottom:14px">수정하면 자동 저장됩니다. 새 구독사의 대시보드 진입 코드는 자동으로 만들어지고 관리자에게만 보입니다. 대시보드 반영은 대표 컴퓨터에서 sync 후 빌드입니다.</div>
  ${SB.list.map((s, i) => `
  <div class="card" data-i="${i}">
    <div class="row"><h3>${esc(s.name || '새 구독사')}</h3>${s.code ? `<span class="chip">${esc(s.code)}</span>` : ''}<div class="sp"></div>
      <select data-f="status" style="width:auto"><option value="active" ${s.status !== 'paused' ? 'selected' : ''}>운영 중</option><option value="paused" ${s.status === 'paused' ? 'selected' : ''}>일시중지</option></select>
      ${S.user.admin ? `<button class="b sm ghost danger" data-del>삭제</button>` : ''}</div>
    <div class="grid g3" style="margin-top:12px">${SUB_FIELDS.map(([k, l, ph]) => `<label class="f"><span>${l}</span><input type="text" data-f="${k}" value="${esc(s[k] ?? '')}" placeholder="${ph}"></label>`).join('')}</div>
    <div class="row" style="margin-top:12px;gap:14px"><span class="muted" style="font-weight:700">채널</span>${CHANNELS.map(([k, l]) => `<label class="row" style="gap:5px;font-size:13px"><input type="checkbox" data-ch="${k}" ${(s.channels || []).includes(k) ? 'checked' : ''}>${l}</label>`).join('')}</div>
  </div>`).join('')}`;
  $('#s-add').onclick = () => { SB.list.push({ id: '', name: '', goal: '아임웹 홈페이지 문의', status: 'active', channels: ['imweb_posts'], gsc_property: '', ga4_property_id: '', imweb_url: '', naver_blog_url: '', instagram: '' }); renderSubs(); const c = $$('#view .card[data-i]').at(-1); c.scrollIntoView({ behavior: 'smooth' }); $('[data-f=name]', c).focus(); };
  $$('#view .card[data-i]').forEach(card => {
    const i = Number(card.dataset.i), s = SB.list[i];
    $$('[data-f]', card).forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { s[el.dataset.f] = el.value.trim(); if (el.dataset.f === 'name') $('h3', card).textContent = el.value || '새 구독사'; markSub(i); }));
    $$('[data-ch]', card).forEach(el => el.addEventListener('change', () => { s.channels = $$('[data-ch]:checked', card).map(x => x.dataset.ch); markSub(i); }));
    const del = $('[data-del]', card);
    if (del) del.onclick = async () => {
      if (!await confirmBox('구독사 삭제', `${esc(s.name)}을(를) 목록에서 지웁니다. 대시보드 데이터 파일은 남습니다. 운영만 멈추려면 일시중지를 쓰세요.`, '삭제')) return;
      if (s.id) await api('deleteSubscriber', s.id); SB.list.splice(i, 1); renderSubs(); toast('삭제했습니다');
    };
  });
}
function markSub(i) { SB.dirty.add(i); $('#s-save').className = 'save dirty'; $('#s-save').textContent = '저장 대기…'; clearTimeout(SB.t); SB.t = setTimeout(flushSubs, 1000); }
async function flushSubs() {
  clearTimeout(SB.t);
  const idx = [...SB.dirty]; SB.dirty.clear();
  for (const i of idx) {
    const s = SB.list[i]; if (!s || !s.name) continue;
    try {
      const r = await api('saveSubscriber', s);
      const fresh = !s.id; Object.assign(s, r);
      if (fresh && S.view === 'subs') { const chip = $(`#view .card[data-i="${i}"] .chip`); if (!chip && s.code) $(`#view .card[data-i="${i}"] h3`).insertAdjacentHTML('afterend', `<span class="chip">${esc(s.code)}</span>`); }
    } catch (e) { SB.dirty.add(i); toast('저장하지 못했습니다: ' + e.message, true); }
  }
  if ($('#s-save') && !SB.dirty.size) { $('#s-save').className = 'save'; $('#s-save').textContent = '저장됨'; }
}

document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); clearTimeout(touched.t); save(); } });
window.RTApp = { S, renderCardFiles, metaBlock, noMaxWidth, placeSlots, linkIssues, themeIssue, lightTheme, darkTheme, markup, parseAi, lint, promptText, blockers, parseSdDoc, makeJsonLd, faqPairs, seoIssues };
