<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raintempo Enterlab</title>
<meta name="description" content="레인템포랩이 운영하는 실험 공간입니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fbfbfa;--ink:#1c1c1f;--muted:#86878d;--line:#ebebea;--accent:#5e6ad2}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f11;--ink:#e8e8ea;--muted:#8a8f98;--line:#232428}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Pretendard Variable",Pretendard,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;font-size:13px}
header b{display:flex;align-items:center;gap:10px;font-weight:600}
header b i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#5e6ad2,#8b93e8)}
a{color:inherit}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 80px;max-width:760px;margin:0 auto;width:100%}
h1{font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.2}
p{color:var(--muted);font-size:15px;line-height:1.7;margin-top:16px;max-width:520px}
.cta{display:inline-flex;margin-top:28px;height:36px;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font-size:13px;font-weight:500}
.cta:hover{border-color:var(--accent)}
footer{color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header><b><i></i>Raintempo Enterlab</b><a href="/admin/" style="color:var(--muted);text-decoration:none">로그인</a></header>
<main>
  <h1>작게 시작해서<br>바로 쓰는 도구를 만듭니다.</h1>
  <p>레인템포랩이 운영하는 실험 공간입니다. 준비 중인 서비스는 이곳에서 먼저 소개합니다.</p>
  <a class="cta" href="https://raintempolab.kr/contact">레인템포랩에 문의하기 →</a>
</main>
<footer><span>© 레인템포랩</span><a href="https://raintempolab.kr">raintempolab.kr</a></footer>
</body>
</html>
