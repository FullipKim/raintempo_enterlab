# raintempoenterlab.kr · Netlify (빌드 없이 저장소 그대로 배포)
[build]
  publish = "."

# 내부 어드민: 검색 노출·캐시·프레임 삽입 막기
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 어드민 소스 폴더는 공개하지 않음
[[redirects]]
  from = "/admin-src/*"
  to = "/404.html"
  status = 404
  force = true
