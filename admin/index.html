<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>레인템포랩 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#f6f6f3;--surface:#ffffff;--sunken:#f0efeb;--ink:#111111;--ink2:#4a4945;--muted:#86847e;
  --line:#e4e2dc;--line2:#d4d2ca;--accent:#1f5fd1;--accent-soft:#e8f0fd;
  --good:#0f7a3a;--good-soft:#e6f4ea;--warn:#a15c00;--warn-soft:#fdf3e1;--bad:#c23030;--bad-soft:#fbeaea;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

/* 버튼 */
.b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.b:hover{background:var(--sunken)}
.b:disabled{opacity:.45;cursor:default}
.b.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.pri:hover{background:#333}
.b.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.b.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.b.ghost{border-color:transparent;background:transparent}
.b.ghost:hover{background:var(--sunken)}
.b.danger{color:var(--bad)}
.b .k{font-size:11px;color:var(--muted);font-weight:500}

/* 입력 */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--ink2)}
.f>small{font-size:12px;color:var(--muted)}
input:not([type]),input[type=text],input[type=url],input[type=date],input[type=time],input[type=datetime-local],input[type=password],input[type=month],select,textarea{
  width:100%;height:38px;padding:0 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:none}
textarea{height:auto;min-height:90px;padding:10px 11px;resize:vertical;line-height:1.7}
textarea.big{min-height:360px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}

/* 레이아웃 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,246,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:block}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.sp{flex:1}
.who{font-size:13px;color:var(--ink2)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.card h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* 칩·배지 */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.chip.c0{background:#e9effb;color:#1f4fa8}.chip.c1{background:#fbeee4;color:#9a4a12}.chip.c2{background:#e7f4ee;color:#16683f}.chip.c3{background:#f1e9f9;color:#6a3aa0}.chip.c4{background:#f9e8ee;color:#a2335a}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:#fff;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="원고 작성"]::before{background:var(--accent)}
.pill[data-s="이미지 리서치"]::before{background:#8a4fd8}
.pill[data-s="디자인 편집"]::before{background:#d0761b}
.pill[data-s="발행 준비"]::before{background:var(--warn)}
.pill[data-s="발행 완료"]{background:var(--good-soft);border-color:#bfe3cb;color:var(--good)}
.pill[data-s="발행 완료"]::before{background:var(--good)}
.pill[data-s="보류"]{color:var(--muted)}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 알림 */
.note{border-radius:10px;padding:11px 14px;font-size:13px;background:var(--accent-soft);color:#1a4a9e;line-height:1.6}
.note.warn{background:var(--warn-soft);color:#7a4600}
.note.bad{background:var(--bad-soft);color:#962323}
.note.good{background:var(--good-soft);color:#115c2f}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#111;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:100;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad)}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:380px;padding:34px 28px}
#login h1{font-size:21px;letter-spacing:-.02em;margin:18px 0 6px}

/* 보드 */
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.stat b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stat.alert b{color:var(--bad)}
@media(max-width:760px){.today{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:13px;color:var(--ink2);padding:0 4px 6px}
.day-h.today-h{color:var(--accent)}
.day-h.past{color:var(--bad)}
.jobs{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.job{display:grid;grid-template-columns:64px 1fr 104px 56px 96px;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.job:first-child{border-top:0}
.job:hover{background:#fafaf8}
.job .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .t.empty{color:var(--muted);font-weight:500}
.job .o{font-size:12px;color:var(--muted);text-align:right}
.job>div:last-child{text-align:right}
.steps{display:flex;gap:4px}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--good)}
@media(max-width:760px){.job{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:12px}.job .steps,.job .o{display:none}.who{display:none}.top-in{padding:10px 14px}main{padding:16px 14px 100px}}
.empty-box{padding:40px 20px;text-align:center;color:var(--muted)}

/* 작업 화면 */
#conflict:not(:empty){position:sticky;top:60px;z-index:15}
.jhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.jhead .title-in{flex:1;min-width:240px;height:44px;font-size:19px;font-weight:800;letter-spacing:-.02em;border-color:transparent;background:transparent;padding:0 8px}
.jhead .title-in:hover{border-color:var(--line2)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.dirty{color:var(--warn)}
.save.err{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{position:relative;height:42px;padding:0 16px;border:0;background:none;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button .n{width:20px;height:20px;border-radius:50%;background:var(--sunken);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tabs button.done .n{background:var(--good);color:#fff}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.side{position:sticky;top:72px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static}}
.check-list{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px}
.check-list li{display:flex;gap:8px;align-items:flex-start}
.check-list li::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:2px solid var(--line2)}
.check-list li.ok::before{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 2px #fff}
.check-list li.no{color:var(--ink)}
.check-list li.opt{color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-weight:500}
.lint{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lint div{font-size:13px;padding:8px 11px;border-radius:8px;background:var(--warn-soft);color:#7a4600}
.lint div.ok{background:var(--good-soft);color:var(--good)}
.lint mark{background:rgba(161,92,0,.15);color:inherit;border-radius:3px;padding:0 2px}
details.fold{border:1px solid var(--line);border-radius:10px;background:#fcfcfa}
details.fold>summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::before{content:"▸";color:var(--muted);transition:.15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>div{padding:0 14px 14px}
.ai-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.ai-steps>div{background:var(--sunken);border-radius:10px;padding:10px 12px;font-size:13px}
.ai-steps b{display:block;font-size:12px;color:var(--muted)}
@media(max-width:760px){.ai-steps{grid-template-columns:1fr}}

/* 이미지 */
.plan{width:100%;border-collapse:separate;border-spacing:0}
.plan th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:0 6px 6px}
.plan td{padding:4px 3px;vertical-align:top}
.plan td:first-child{width:34px;text-align:center;font-weight:800;color:var(--muted);padding-top:12px}
.plan input,.plan textarea{height:36px;min-height:36px;font-size:13px}
.plan textarea{padding:8px 10px;line-height:1.45;height:auto;min-height:0;resize:vertical}
.plan .x{width:34px}
@media(max-width:760px){.plan thead{display:none}.plan tr{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:8px 0;border-top:1px solid var(--line)}.plan td:nth-child(n+4){grid-column:2/-1}}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);cursor:pointer;background:#fcfcfa;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:15px;margin-bottom:3px;color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.thumb .im{aspect-ratio:4/5;background:var(--sunken) center/contain no-repeat;position:relative}
.thumb .im span{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:1px 7px}
.thumb .meta{padding:8px 9px;font-size:12px;color:var(--ink2);min-height:44px}
.thumb .act{display:flex;border-top:1px solid var(--line)}
.thumb .act button{flex:1;height:30px;border:0;background:none;cursor:pointer;font-size:13px}
.thumb .act button:hover{background:var(--sunken)}
.thumb .act button+button{border-left:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}

/* 발행 */
iframe.preview{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.copyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.copyrow .b{height:auto;padding:14px;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;white-space:normal}
.copyrow .b span{font-size:12px;color:var(--muted);font-weight:500}
.copyrow .b.pri span{color:#bbb}
@media(max-width:760px){.copyrow{grid-template-columns:1fr}}

/* 대화상자 */
dialog{margin:auto;border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,20,.35)}
dialog .dh{padding:18px 20px 0;font-size:17px;font-weight:800}
dialog .db{padding:14px 20px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.wd{display:flex;gap:4px}
.wd label{display:flex}
.wd input{display:none}
.wd span{width:36px;height:34px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:13px}
.wd input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.bulk-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bulk-list>div{display:grid;grid-template-columns:120px 1fr 30px;gap:6px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--muted)}
/* 카드 만들기 */
.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.cd{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.cd-h{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:6px}
.cd-lay{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:130px}
.cd-logo{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted,#666);cursor:pointer;white-space:nowrap}
.cd-logo input{margin:0}
.cd-c{position:relative;border-radius:8px;overflow:hidden;background:#111;aspect-ratio:1/1}
.cd-c canvas{width:100%;height:100%;display:block;touch-action:none}
.cd-c.has canvas{cursor:grab}
.cd-c.over{outline:3px solid var(--accent);outline-offset:-3px}
.cd-drop{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;pointer-events:none}
.cd-c.has .cd-drop{display:none}
.cd-t{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:30px}
.cd-t input[type=range]{flex:1;min-width:0}

/* 레인템포랩 어드민 · Linear 풍 덮어쓰기 (기존 Styles 다음에 읽힌다) */
:root{
  --page:#fbfbfa;--surface:#ffffff;--sunken:#f3f3f2;--ink:#1c1c1f;--ink2:#47484d;--muted:#86878d;
  --line:#ebebea;--line2:#dcdcda;--accent:#5e6ad2;--accent-soft:#eef0fc;
  --good:#2e7d4f;--good-soft:#e9f5ee;--warn:#b26b00;--warn-soft:#fbf3e4;--bad:#d2443a;--bad-soft:#fcecea;
  --radius:8px;--shadow:none;--sb:224px;
}
html,body{background:var(--page)}
body{font-family:"Inter","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:13px;line-height:1.5;letter-spacing:-.003em;font-feature-settings:"cv11","ss01"}
::selection{background:#dfe2fb}

/* 버튼 */
.b{height:28px;padding:0 10px;border-radius:6px;font-weight:500;font-size:13px;border-color:var(--line2);gap:6px;transition:background .12s,border-color .12s}
.b:hover{background:var(--sunken)}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.pri:hover{background:#4f5bc4;border-color:#4f5bc4}
.b.acc{background:var(--ink);border-color:var(--ink)}
.b.sm{height:24px;padding:0 8px;font-size:12px;border-radius:5px}
.b.ghost{color:var(--ink2)}
.b .k{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:16px}

/* 입력 */
.f>span{font-size:12px;font-weight:500;color:var(--muted)}
input:not([type]),input[type=text],input[type=url],input[type=date],input[type=time],input[type=datetime-local],input[type=password],input[type=month],select,textarea{height:32px;border-radius:6px;border-color:var(--line2);padding:0 10px;font-size:13px}
textarea{padding:8px 10px;line-height:1.65}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,.16)}

/* 셸: 왼쪽 사이드바 */
#app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--line);background:#f7f7f6}
.sb .brand{height:32px;padding:0 8px;margin-bottom:10px;font-weight:600;font-size:13px;letter-spacing:-.01em;gap:8px;border-radius:6px}
.sb .brand:hover{background:var(--sunken)}
.sb .brand i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#5e6ad2,#8b93e8)}
.sb .grp{font-size:11px;font-weight:500;color:var(--muted);padding:14px 8px 4px}
.sb nav{display:flex;flex-direction:column;gap:1px}
.sb nav button,.sb a.navlink{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--ink2);font-weight:500;font-size:13px;cursor:pointer;text-align:left;text-decoration:none}
.sb nav button:hover,.sb a.navlink:hover{background:var(--sunken);color:var(--ink)}
.sb nav button.on{background:#ebebea;color:var(--ink)}
.sb nav button svg,.sb a.navlink svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.75}
.sb .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line)}
.sb .who{flex:1;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sb .av{width:22px;height:22px;border-radius:50%;background:#e3e4f6;color:#4b55b5;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
main{max-width:none;margin:0;padding:18px 28px 120px}
main>*{max-width:1240px}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  .sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .sb .brand{margin:0}.sb .grp{display:none}.sb nav{flex-direction:row}.sb .foot{margin:0 0 0 auto;border:0;padding:0}
  main{padding:14px 14px 100px}
}

/* 카드 → 얇은 테두리 면 */
.card{border-radius:8px;border-color:var(--line);box-shadow:none;padding:16px}
.card+.card{margin-top:12px}
.card h3{font-size:13px;font-weight:600}
.card h3 small{font-size:12px}
.muted{font-size:12px}
.hr{margin:14px 0}

/* 칩·상태 */
.chip{height:20px;padding:0 7px;border-radius:4px;font-size:11px;font-weight:500;border:1px solid transparent}
.chip.c0{background:#eef2fd;color:#3d5bb5}.chip.c1{background:#fdf1e8;color:#a5571d}.chip.c2{background:#eaf6ef;color:#2b7a4b}.chip.c3{background:#f4eefb;color:#7448a8}.chip.c4{background:#fceef3;color:#a83f66}
.pill{height:20px;padding:0 7px 0 6px;border-radius:4px;font-size:11px;font-weight:500;border-color:var(--line2);gap:5px}
.pill::before{width:8px;height:8px;border:1.5px solid var(--muted);background:transparent!important;box-sizing:border-box}
.pill[data-s="원고 작성"]::before{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 30%,transparent 30%)!important}
.pill[data-s="이미지 리서치"]::before{border-color:#8a4fd8;background:linear-gradient(90deg,#8a4fd8 45%,transparent 45%)!important}
.pill[data-s="디자인 편집"]::before{border-color:#d0761b;background:linear-gradient(90deg,#d0761b 60%,transparent 60%)!important}
.pill[data-s="발행 준비"]::before{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 80%,transparent 80%)!important}
.pill[data-s="발행 완료"]{background:#fff;border-color:var(--line2);color:var(--ink2)}
.pill[data-s="발행 완료"]::before{border-color:var(--accent);background:var(--accent)!important}
.seg{background:var(--sunken);border-radius:7px;padding:2px}
.seg button{height:24px;padding:0 10px;border-radius:5px;font-weight:500;font-size:12px}
.seg button.on{box-shadow:0 0 0 1px var(--line2),0 1px 1px rgba(0,0,0,.04)}

/* 알림 */
.note{border-radius:6px;padding:9px 12px;font-size:12px;border:1px solid transparent}
.note{background:var(--accent-soft);color:#3f49a6;border-color:#dfe2fa}
.note.warn{border-color:#f2e2c3}.note.bad{border-color:#f5d3cf}.note.good{border-color:#cfe8d9}
.toast{border-radius:8px;font-weight:500;font-size:13px;padding:9px 14px;background:#1c1c1f;box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* 로그인 */
#login{background:var(--page)}
#login .card{max-width:340px;padding:28px 24px;text-align:left}
#login h1{font-size:17px;font-weight:600;margin:16px 0 4px}
.gbtn{width:100%;height:36px;margin-top:18px;justify-content:center;gap:10px;font-weight:500}
.gbtn svg{width:16px;height:16px}

/* 보드: 촘촘한 목록 */
.today{gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:14px}
.stat{border:0;border-radius:0;padding:10px 14px;border-left:1px solid var(--line);background:none}
.stat:first-child{border-left:0}
.stat b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:11px;font-weight:500}
.stat.on{box-shadow:inset 0 -2px 0 var(--accent);border-color:var(--line)}
.stat:hover{background:#fafafa}
.toolbar{gap:6px;margin-bottom:10px}
.day{margin-top:14px}
.day-h{font-weight:500;font-size:12px;color:var(--muted);padding:0 2px 4px}
.day-h.today-h{color:var(--accent)}
.jobs{border-radius:8px}
.job{grid-template-columns:56px minmax(0,1fr) 110px 52px 90px;gap:10px;padding:0 12px;height:38px;border-top-color:var(--line)}
.job:hover{background:#f8f8f7}
.job .t{font-weight:500}
.steps i{width:14px;height:4px;border-radius:2px}
.steps i.on{background:var(--accent)}
@media(max-width:760px){.job{height:auto;padding:10px 12px}}

/* 작업 화면 */
#conflict:not(:empty){top:8px}
.jhead .title-in{height:38px;font-size:17px;font-weight:600}
.tabs{gap:2px;margin-bottom:14px}
.tabs button{height:36px;padding:0 12px;font-weight:500;font-size:13px}
.tabs button .n{width:16px;height:16px;font-size:10px}
.tabs button.done .n{background:var(--accent)}
.tabs button.on::after{height:1.5px;background:var(--accent)}
.side{top:16px}
.check-list li::before{width:14px;height:14px;border-width:1.5px}
.check-list li.ok::before{background:var(--accent);border-color:var(--accent)}
.lint div{border-radius:6px;font-size:12px}
details.fold{border-radius:8px;background:var(--surface)}
details.fold>summary{font-weight:500;padding:9px 12px}
.ai-steps>div{border-radius:6px}
.drop{border:1px dashed var(--line2);border-radius:8px;background:var(--surface)}
.drop b{font-size:13px;font-weight:600}
.thumb,.cd{border-radius:8px}
dialog{border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.18)}
dialog .dh{font-size:14px;font-weight:600;padding:16px 18px 0}
dialog .db{padding:12px 18px}
dialog .df{padding:10px 18px 14px}
.wd span{border-radius:6px;height:28px;width:32px;font-weight:500}
.wd input:checked+span{background:var(--accent);border-color:var(--accent)}
.plan th{font-weight:500}
.plan td:first-child{font-weight:600}
iframe.preview{border-radius:8px}
main h2[style*="font-size:20px"]{font-size:15px!important;font-weight:600;letter-spacing:-.01em!important}
main h2{font-weight:600}
/* 설정 목록 */
.lrow{display:grid;grid-template-columns:auto minmax(120px,220px) minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:0 12px;height:40px;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:hover{background:#f8f8f7}
.lrow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .av,.sb .av{width:22px;height:22px;border-radius:50%;background:#e3e4f6;color:#4b55b5;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sform{padding:14px 12px 14px;border-top:1px solid var(--line);background:#fafafa}
.tag{display:inline-flex}
.tag input{display:none}
.tag span{height:24px;padding:0 9px;border:1px solid var(--line2);border-radius:5px;display:inline-flex;align-items:center;font-size:12px;cursor:pointer;background:#fff}
.tag input:checked+span{background:var(--accent-soft);border-color:#c9cdf4;color:#3f49a6}
.tabs .count{margin-left:6px;font-size:11px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

</style>
</head>
<body>

<section id="login" hidden>
  <div class="card" id="login-form">
    <div class="brand"><i></i>레인템포랩 <small>어드민</small></div>
    <h1>로그인</h1>
    <p class="muted">등록된 구글 계정으로 들어옵니다.</p>
    <input type="hidden" id="login-code">
    <button type="button" class="b gbtn" id="login-btn"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>Google로 계속하기</button>
    <p class="muted" id="login-err" style="color:var(--bad);margin-top:10px" hidden></p>
  </div>
</section>

<div id="app" hidden>
  <aside class="sb">
    <div class="brand" id="go-home"><i></i>레인템포랩</div>
    <div class="grp">작업</div>
    <nav id="nav">
      <button data-v="content" class="on"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M5 6h6M5 9h4"/></svg>콘텐츠 제작</button>
      <button data-v="report"><svg viewBox="0 0 16 16"><path d="M2.5 13.5h11M4.5 11V7M8 11V4M11.5 11V8.5"/></svg>월간 보고</button>
      <button data-v="subs"><svg viewBox="0 0 16 16"><circle cx="6" cy="6" r="2.5"/><path d="M1.5 13.5c.6-2.4 2.3-3.5 4.5-3.5s3.9 1.1 4.5 3.5M11 4.5a2 2 0 010 4M12.5 10.5c1 .5 1.7 1.5 2 3"/></svg>구독사</button>
      <button data-v="settings" id="nav-settings" hidden><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>설정</button>
    </nav>
    <a class="b sm ghost" id="open-sheet" target="_blank" rel="noopener" hidden></a>
    <div class="foot"><span class="av" id="av"></span><span class="who" id="who"></span><button class="b sm ghost" id="logout" title="로그아웃">나가기</button></div>
  </aside>
  <main id="view"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 일정 추가 -->
<dialog id="dlg-new">
  <div id="new-form">
    <div class="dh">일정 추가</div>
    <div class="db">
      <div class="seg" id="new-mode" style="margin-bottom:14px"><button type="button" class="on" data-m="one">한 건</button><button type="button" data-m="bulk">한 달 일괄</button></div>
      <div class="grid g2">
        <label class="f"><span>고객사</span><select name="client"></select></label>
        <label class="f"><span>담당자</span><select name="owner"></select></label>
      </div>
      <div data-m="one" class="grid g2" style="margin-top:12px">
        <label class="f"><span>발행일</span><input type="date" name="date"></label>
        <label class="f"><span>종류</span><select name="kind"><option value="basic">일반 정보글</option><option value="event">경제지표·시의성</option><option value="article">홈페이지 아티클</option><option value="project">홈페이지 프로젝트</option></select></label>
        <label class="f" style="grid-column:1/-1"><span>주제 (나중에 정해도 됩니다)</span><input type="text" name="title" placeholder="예: MT5에서 차트 시간 단위 바꾸는 법"></label>
      </div>
      <div data-m="bulk" hidden style="margin-top:12px">
        <div class="grid g2">
          <label class="f"><span>월</span><input type="month" name="month"></label>
          <div class="f"><span>발행 요일</span><div class="wd" id="wd"></div></div>
          <label class="f"><span>종류</span><select name="bkind"><option value="basic">일반 정보글</option><option value="article">홈페이지 아티클</option><option value="project">홈페이지 프로젝트</option></select></label>
        </div>
        <label class="f" style="margin-top:12px"><span>주제 목록 · 한 줄에 하나 (비워두면 주제 미정으로 등록)</span><textarea name="topics" rows="4" placeholder="MT5 설치 방법&#10;손절 설정하는 법"></textarea></label>
        <div class="muted" style="margin-top:10px" id="bulk-sum"></div>

      </div>
    </div>
    <div class="df"><button type="button" class="b" data-close="cancel">취소</button><button type="button" class="b pri" id="new-ok" data-close="ok">등록</button></div>
  </div>
</dialog>

<!-- 월간 Canva 대량 제작 파일 -->
<dialog id="dlg-csv">
  <div>
    <div class="dh">Canva 대량 제작 파일 (한 달 치)</div>
    <div class="db">
      <p class="muted">Canva 대량 제작은 <b>파일의 한 행이 디자인 한 개</b>가 됩니다. 그래서 파일에는 제목과 본문 열만 넣습니다.</p>

          <option value="single">한 장: 이미지 1장 = 디자인 1개 (한 페이지 템플릿)</option></select></label>
        <label class="f" id="csv-type-wrap" hidden><span>페이지 유형</span><select id="csv-type"></select></label>
      </div>
      <p class="muted" id="csv-sum" style="margin-top:10px;white-space:pre-line"></p>
    </div>
    <div class="df"><button type="button" class="b" data-close="cancel">닫기</button><button class="b" type="button" id="csv-go">CSV</button><button class="b pri" type="button" id="xlsx-go">엑셀 받기 (줄바꿈 유지)</button></div>
  </div>
</dialog>

<!-- 확인 -->
<dialog id="dlg-confirm">
  <div>
    <div class="dh" id="cf-title"></div>
    <div class="db" id="cf-body"></div>
    <div class="df"><button type="button" class="b" data-close="cancel">취소</button><button type="button" class="b pri" data-close="ok" id="cf-ok">확인</button></div>
  </div>
</dialog>

/* 한 장 그리기. photo: Image 또는 null. 돌려주는 값: 사진 칸 위치(끌어서 옮기기용) */
function draw(canvas, th, item, photo, set, logoImg, opt) {

    const R = { x: 250, y: y + 70, w: 580, h: 950 - (y + 70) };

    else if (opt.preview) { slot = R; empty(ctx, R, 24, TAKES_PHOTO.cover); }
  } else if (k === 'photo') {
    if (showLogo) logo(ctx, th, logoImg);
    ctx.font = font(500, 30); const C = body ? wrap(ctx, body, 880).slice(0, 2) : [];
    const top = showLogo ? 244 : 170, R = { x: 119, y: top, w: 842, h: (C.length ? 960 - (C.length - 1) * 44 : 990) - top };
    slot = photo ? cover(ctx, photo, R, 22, set) : (opt.preview ? (empty(ctx, R, 22, TAKES_PHOTO.photo), R) : R);
    if (C.length) { ctx.font = font(500, 30); lines(ctx, C, S / 2, R.y + R.h + 40, 44, '#e6e6e6'); }
  } else if (k === 'explain') {
    const T = fit(ctx, title, 860, 800, 60, 42, 2); ctx.font = font(800, T.size);
    let y = title ? lines(ctx, T.lines, S / 2, 239 + off - (T.lines.length - 1) * T.size * 0.4, T.size * 1.28, '#ffffff') : 160 + off;
    if (photo) {
      ctx.font = font(500, 28); const C = body ? wrap(ctx, body, 760).slice(0, 3) : [];
      const boxTop = C.length ? 1080 - 60 - C.length * 42 - 40 : 1010;
      const R = { x: 119, y: y + T.size * 0.75 + 20, w: 842, h: boxTop - 40 - (y + T.size * 0.75 + 20) };
      slot = cover(ctx, photo, R, 22, set);

        ctx.font = font(500, 28); lines(ctx, C, S / 2, boxTop + 58, 42, '#ececec');
      }
    } else if (body) {
      const B = fit(ctx, body, 740, 600, 40, 28, 7), lh = B.size * 1.6, bh = (B.lines.length - 1) * lh + B.size + 120;
      const top = y + T.size * 0.75 + 60, by = Math.max(top, (top + 990) / 2 - bh / 2);
      glass(ctx, 119, by, 842, bh, 30, 0.055);

      const R = { x: 119, y: yT + 36, w: 842, h: Math.max(200, 990 - barsH - (yT + 36)) };
      slot = cover(ctx, photo, R, 22, set);
      bars(ctx, th, items, R.y + R.h + 36, 990, bh);
    } else bars(ctx, th, listItems(body, 6), yT + 70, 985, 132);
  } else if (k === 'table') {
    const yT = head(ctx, title, 239 + off, 60) + (title ? 0 : off);

      const R = { x: 119, y: yT + 36, w: 842, h: Math.max(200, 990 - tH - (yT + 36)) };
      slot = cover(ctx, photo, R, 22, set);
      grid(ctx, th, rows, R.y + R.h + 36, 990, rh, 28);
    } else grid(ctx, th, tableRows(body, 7), yT + 60, 985, 118, 34);
  } else if (k === 'closing') {
    let y = 230 + off; if (off) logo(ctx, th, logoImg, 124);
    if (body) { const K = fit(ctx, body, 520, 700, 32, 24, 2); ctx.font = font(700, K.size); y = lines(ctx, K.lines, 124, y, K.size * 1.45, th.red, 'left') + K.size * 1.6; }
    const T = fit(ctx, title, photo ? 540 : 840, 800, 58, 40, 4); ctx.font = font(800, T.size);
    lines(ctx, T.lines, 124, y + T.size * 0.4, T.size * 1.38, '#ffffff', 'left');
    const px = 115, py = 725, pw = 487, ph = 215;
    rr(ctx, px, py, pw, ph, ph / 2); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.38)'; ctx.lineWidth = 2.5; ctx.stroke();

<script>
(() => {
'use strict';

/* ════════════════════ 상태 · 공통 ════════════════════ */

  token: null, user: null, boot: null,

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', bad ? 5000 : 2600);
}
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

function run(fn, args) { return window.RTBackend.run(fn, args); }
/** 서버 호출. 세션이 끝났으면 로그인 후 같은 요청을 다시 보낸다. */
async function api(fn, ...args) {
  try { return await run(fn, [S.token, ...args]); }
  catch (e) {
    const msg = (e && e.message) || String(e);
    if (msg.includes('SESSION_EXPIRED')) { await relogin(); return run(fn, [S.token, ...args]); }
    throw new Error(msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''));
  }
}
function confirmBox(title, html, okText = '확인') {

  d.returnValue = ''; d.showModal();

}

/* ════════════════════ 로그인 ════════════════════ */

$$('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close(b.dataset.close)));

    const r = await run('login', [$('#login-code').value]);
    $('#login-code').value = '';

/* ── Canva 대량 제작 표 ──
 * Canva 는 파일의 한 행마다 템플릿 전체를 복제한다. 그래서
 * 세트: 한 행 = 글 1편, 열 = 페이지별 제목·본문 (1_제목, 1_본문, 2_제목 …)
 * 한 장: 한 행 = 이미지 1장, 열 = 제목·본문
 * 번호·유형·alt 같은 열은 넣지 않는다 (자동 연결이 엉뚱한 글상자에 붙는다). */
function setTable(sets) {
  // 사진 페이지와 모든 글에서 비어 있는 페이지는 열을 만들지 않는다. 열 이름은 템플릿 페이지 번호 그대로.
  const n = Math.max(1, ...sets.map(p => p.length)), cols = [];
  for (let i = 0; i < n; i++) if (sets.some(p => p[i] && !NO_TEXT(p[i].type) && (p[i].title || p[i].body))) cols.push(i);
  const head = []; cols.forEach(i => head.push((i + 1) + '_제목', (i + 1) + '_본문'));
  return [head, ...sets.map(p => { const r = []; cols.forEach(i => { const x = p[i] && !NO_TEXT(p[i].type) ? p[i] : {}; r.push(x.title || '', x.body || ''); }); return r; })];
}
function singleTable(items) { return [['제목', '본문'], ...items.filter(i => !NO_TEXT(i.type) && (i.title || i.body)).map(i => [i.title || '', i.body || ''])]; }
function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? '').replace(/\r/g, ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
function colName(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
/** 줄바꿈을 그대로 담는 최소 XLSX (외부 라이브러리 없이 JSZip 으로) */
async function xlsx(rows) {
  const xe = v => String(v ?? '').replace(/\r/g, '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const NS = 'http:' + '/' + '/schemas.openxmlformats.org/';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const z = new JSZip();
  z.file('[Content_Types].xml', head + '<Types xmlns="' + NS + 'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  z.file('_rels/.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml', head + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets><sheet name="Canva" sheetId="1" r:id="rId1"/></sheets></workbook>');
  z.file('xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml', head + '<styleSheet xmlns="' + NS + 'spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  const body = rows.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((v, ci) => '<c r="' + colName(ci) + (ri + 1) + '" t="inlineStr" s="1"><is><t xml:space="preserve">' + xe(v) + '</t></is></c>').join('') + '</row>').join('');
  z.file('xl/worksheets/sheet1.xml', head + '<worksheet xmlns="' + NS + 'spreadsheetml/2006/main"><cols><col min="1" max="' + Math.max(1, rows[0].length) + '" width="28" customWidth="1"/></cols><sheetData>' + body + '</sheetData></worksheet>');
  return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ── 필드 바인딩 · 자동 저장 ── */
const META = ['title', 'date', 'kind', 'owner', 'status', 'blogUrl', 'webUrl', 'folderUrl'];
function getVal(k) { return META.includes(k) ? S.job[k] : B()[k]; }
function setVal(k, v) { if (META.includes(k)) S.job[k] = v; else B()[k] = v; }
function bindFields(root) {
  $$('[data-k]', root).forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = !!getVal(k); else if (el.value === '' && getVal(k)) el.value = getVal(k);
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      setVal(k, el.type === 'checkbox' ? el.checked : el.value);

    });
  });
}
function touched(k) {
  S.dirty = true; saveState('dirty');
  if (S.job.status === '예정' && ['blog', 'web', 'webHtml', 'brief', 'images'].includes(k)) { S.job.status = '원고 작성'; if ($('#status')) $('#status').value = '원고 작성'; }
  /* 수동 저장: 저장 버튼 · ⌘S · 상태 변경 · 일정으로 나갈 때 저장한다. 깜빡해도 90초 뒤 한 번 저장 */
  clearTimeout(touched.t);

  else { renderSide(); liveUpdate(k); }
}
function saveState(s, extra) {

  el.className = 'save ' + (s === 'dirty' ? 'dirty' : s === 'err' ? 'err' : '');
  el.textContent = s === 'dirty' ? '저장 안 됨' : s === 'saving' ? '저장 중…' : s === 'err' ? '저장 실패 · ' + extra : `저장됨 · v${S.job.version}`;

}
function patch() {

  ['brief', 'source', 'releaseAt', 'confirmedAt', 'publishTime', 'blog', 'web', 'webHtml', 'images', 'notes', 'reviewed', 'designUrl', 'history', 'extra', 'cards'].forEach(k => { if (B()[k] !== undefined) p[k] = B()[k]; });

}
async function save() {

  S.saving = true; S.dirty = false; saveState('saving');
  const job = S.job;

    const r = await api('saveJob', job.id, patch(), job.version);

window.addEventListener('beforeunload', e => { if (S.dirty || R.queue.length || SB.dirty.size) { e.preventDefault(); e.returnValue = ''; } });

async function upload(files) {

          if (e.dir || e.name.startsWith('__MACOSX') || base.startsWith('.') || !/\.(png|jpe?g|webp)$/i.test(base)) continue;
          list.push({ name: base, path: e.name, blob: await e.async('blob') });

  const big = list.find(x => x.blob.size > 15 * 1024 * 1024); if (big) return toast(big.name + ' 파일이 15MB를 넘습니다.', true);

  let startAt = 1;

    const replace = await confirmBox('이미지 올리기', `이미 ${S.images.length}장이 있습니다. 새 ${list.length}장으로 모두 교체합니다. 기존 이미지는 드라이브 휴지통으로 옮겨집니다.`, `${list.length}장으로 교체`);

function faqPairs(html) {
  if (!html || !/FAQ|자주\s*묻는|자주\s*하는\s*질문/i.test(html)) return [];
  const d = new DOMParser().parseFromString(html, 'text/html');

  d.querySelectorAll('br').forEach(e => e.replaceWith('\n'));
  d.querySelectorAll('h1,h2').forEach(e => e.prepend('\u0001'));
  d.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,dt,dd,summary,details,div,section,tr,table,blockquote').forEach(e => { e.prepend('\n'); e.append('\n'); });
  const lines = d.body.textContent.split('\n').map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const start = lines.findIndex(x => /FAQ|자주\s*묻는|자주\s*하는\s*질문/i.test(x));
  if (start < 0) return [];
  const isQ = x => /^Q\s*\d*\s*[.:)]/i.test(x) || /^질문\s*\d*\s*[.:)]/.test(x) || (/[?？]$/.test(x) && x.length <= 150);

 * 형식: 첫 줄 [SD-코드] 제목 · 메타 표(타깃 키워드, 홈페이지 슬러그, 메타 설명 …)

function parseSdDoc(raw) {
  /* 구글 문서의 줄 안 줄바꿈(Shift+Enter)은 \r 또는 \v 로 들어오므로 모두 \n 으로 맞춘다 */
  const text = String(raw || '').replace(/\r\n/g, '\n').replace(/[\r\u000b\u2028]/g, '\n').replace(/\u00a0/g, ' ');
  /* 채팅 답변을 그대로 복사하면 마크다운 기호가 섞이므로 걷어낸다 */
  const lines = text.split('\n').map(l => l.replace(/^\s*#{1,6}\s+/, '').replace(/^\s*>\s?/, '').replace(/\*\*/g, '').replace(/\\([\[\]().#*_>|-])/g, '$1'));
  const find = (re, from = 0) => { for (let i = Math.max(0, from); i < lines.length; i++) if (re.test(lines[i].trim())) return i; return -1; };
  const head = w => new RegExp('^(\\d+[.)]\\s*)?' + w);
  const iBlog = find(head('네이버\\s*블로그')), iWeb = find(head('홈페이지\\s*(게시판|원고)')), iInsta = find(head('인스타(그램)?\\s*카드\\s*뉴스'));
  if ([iBlog, iWeb, iInsta].filter(i => i >= 0).length < 2) return null;
  const iFaq = find(/^\d*\.?\s*FAQ/, Math.max(iBlog, iWeb, iInsta));
  const stop = (...xs) => { const v = xs.filter(i => i >= 0); return v.length ? Math.min(...v) : lines.length; };
  const meta = k => { const m = text2.match(new RegExp(k + '[ \\t]*[\\t\\n][ \\t]*([^\\n\\t]+)')); return m ? m[1].trim() : ''; };
  const first = (lines.find(l => l.trim()) || '').trim();
  const text2 = lines.join('\n');
  const code = (text2.match(/\b(SD-[A-Z]+\d+)\b/) || [])[1] || '';
  let blog = '', titles = [];
  if (iBlog >= 0) {
    const s = find(/^본문\s*[—–-]/, iBlog), t0 = find(/^제목안/, iBlog);
    blog = lines.slice(s >= 0 ? s + 1 : iBlog + 1, stop(iWeb, iInsta, iFaq)).join('\n').trim();
    if (t0 >= 0 && s > t0) titles = lines.slice(t0 + 1, s).map(x => x.trim().replace(/^\d+[.)]\s*/, '')).filter(Boolean);
  }
  let webHtml = '', webTitle = '', category = '';
  if (iWeb >= 0) {
    const seg = lines.slice(iWeb + 1, stop(iInsta, iFaq));
    const m = seg.join('\n').match(/제목은\s*(.+?),\s*분류는\s*(.+?)입니다/);
    /* HTML 은 코드 블록(```)으로 감싸져 올 수 있다 */
    for (let i = 0; i < seg.length; i++) if (/^\s*```/.test(seg[i])) seg[i] = '';
    if (m) { webTitle = m[1].trim(); category = m[2].trim(); }
    const a = seg.findIndex(l => l.trim().startsWith('<')); let z = -1;
    seg.forEach((l, i) => { if (l.trim().endsWith('>')) z = i; });
    if (a >= 0 && z >= a) webHtml = seg.slice(a, z + 1).join('\n').trim();
  }
  const cards = []; const cap = [], tags = [];
  if (iInsta >= 0) {
    let cur = null, mode = 'card';
    const flush = () => { if (cur) cards.push(cur); cur = null; };
    for (const line of lines.slice(iInsta + 1, stop(iFaq))) {
      const l = line.trim();

      if (/^\[해시태그\]/.test(l)) { flush(); mode = 'tag'; continue; }

      if (mode === 'tag') { if (l) tags.push(l); continue; }
      const h = l.match(/^\[(카드[^\]]*|마지막\s*카드)\]\s*(.*)$/);

  cards.forEach((c, i) => {

    const n = Number((c.head.match(/카드\s*(\d+)/) || [])[1]);

    title: webTitle || first.replace(/^\[[^\]]+\]\s*/, ''), blog, webHtml, images,
    extra: { code, titles, keyword: [meta('타깃 키워드'), ...meta('보조 키워드').split(/\s*[·,，、\/]\s*/)].map(x => x.replace(/\*/g, '').trim()).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(', '), slug: meta('홈페이지 슬러그'), meta: meta('메타 설명'), category, caption: cap.join('\n').trim(), hashtags: tags.join(' ') }

}
/* 커버 제목은 두 줄: 줄바꿈이 없으면 가운데에 가까운 띄어쓰기에서 나눈다 */
function twoLines(t) {

  const sp = [...t.matchAll(/ /g)].map(m => m.index); if (!sp.length) return t;
  const mid = t.length / 2, k = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);

}

})();
</script>

<script>/* 설정 (관리자): 운영 시트의 고객사 · 직원 탭을 대신한다. API 키도 여기서 만든다. */
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const A = () => window.RTBackend.admin;
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', bad ? 5000 : 2600); };
const RULES = [['background', '홈페이지 바탕색', '예: #121212 (어두운 바탕). 지정하지 않으면 흰 바탕'], ['blog', '블로그 작성 규칙', ''], ['web', '홈페이지 작성 규칙', ''],
  ['design', '이미지 제작 규칙', ''], ['links', '링크·브랜드 규칙', ''], ['sources', '참고 문서', '한 줄에 하나 · 이름|문서 ID 또는 링크']];
const ST = { tab: 'clients', clients: [], staff: [], keys: [], open: null };

async function render(root) {
  if (!window.RTBackend.admin.me()?.user.admin) { root.innerHTML = '<div class="empty-box">설정은 관리자만 볼 수 있습니다.</div>'; return; }
  root.innerHTML = '<div class="loading"><span class="spin"></span></div>';
  try { [ST.clients, ST.staff, ST.keys] = await Promise.all([A().clients(), A().staff(), A().keys()]); }
  catch (e) { root.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  paint(root);
}
function paint(root) {
  const T = { clients: '고객사', staff: '직원', keys: 'API 키' };
  root.innerHTML = `<div class="set">
    <div class="row" style="margin-bottom:12px"><h2 style="font-size:15px;font-weight:600">설정</h2><div class="sp"></div></div>
    <div class="tabs">${Object.entries(T).map(([k, v]) => `<button data-st="${k}" class="${ST.tab === k ? 'on' : ''}">${v}<span class="count">${ST[k].length}</span></button>`).join('')}</div>
    <div id="set-body"></div></div>`;
  $$('[data-st]', root).forEach(b => b.onclick = () => { ST.tab = b.dataset.st; ST.open = null; paint(root); });
  ({ clients: clientsView, staff: staffView, keys: keysView })[ST.tab]($('#set-body', root), root);
}

/* 고객사 */
function clientsView(el, root) {
  el.innerHTML = `<div class="toolbar"><span class="muted">작성 규칙 칸에 적은 내용이 기본 규칙보다 우선합니다.</span><div class="sp"></div><button class="b sm" id="c-new">+ 고객사</button></div>
    <div class="jobs">${ST.clients.map(c => `<div class="lrow" data-c="${esc(c.id)}"><span class="chip c${(c.order ?? 0) % 5}">${esc(c.short)}</span><b>${esc(c.name)}</b>
      <span class="muted">${c.folderId ? '드라이브 연결' : '<span style="color:var(--warn)">드라이브 폴더 없음</span>'}</span><span class="muted">${Object.values(c.rules || {}).filter(v => String(v || '').trim()).length}/6 규칙</span>
      <span class="pill" data-s="${c.active === false ? '보류' : '발행 완료'}">${c.active === false ? '사용 안 함' : '사용'}</span></div>
      ${ST.open === c.id ? clientForm(c) : ''}`).join('')}${ST.open === '__new' ? clientForm({ id: '', name: '', short: '', active: true, rules: {} }) : ''}</div>`;
  $('#c-new', el).onclick = () => { ST.open = '__new'; paint(root); };
  $$('[data-c]', el).forEach(r => r.onclick = () => { ST.open = ST.open === r.dataset.c ? null : r.dataset.c; paint(root); });
  const f = $('.sform', el); if (!f) return;
  f.querySelector('[data-cancel]').onclick = () => { ST.open = null; paint(root); };
  f.querySelector('[data-save]').onclick = async () => {
    const v = n => f.querySelector(`[name="${n}"]`);
    const c = { id: f.dataset.id || '', name: v('name').value.trim(), short: v('short').value.trim(), folderId: v('folderId').value.trim(), template: v('template').value.trim(),
      active: v('active').checked, order: Number(v('order').value || 0), rules: Object.fromEntries(RULES.map(([k]) => [k, v('r_' + k).value])) };
    try { await A().saveClient(c); toast('저장했습니다. 새로 고침하면 작성 화면에 반영됩니다'); ST.open = null; render(root); } catch (e) { toast(e.message, true); }
  };
}
function clientForm(c) {
  const r = c.rules || {};
  return `<div class="sform" data-id="${esc(c.id)}" onclick="event.stopPropagation()">
    <div class="grid g4">
      <label class="f"><span>고객사 이름</span><input name="name" value="${esc(c.name)}"></label>
      <label class="f"><span>약칭</span><input name="short" value="${esc(c.short)}" ${c.id ? 'readonly title="약칭은 문서 ID 라 바꿀 수 없습니다"' : ''}></label>
      <label class="f"><span>순서</span><input name="order" type="text" inputmode="numeric" value="${esc(c.order ?? '')}"></label>
      <label class="f"><span>사용</span><span class="row" style="height:32px"><input type="checkbox" name="active" ${c.active !== false ? 'checked' : ''}> 작성 화면에 보이기</span></label>
      <label class="f" style="grid-column:span 2"><span>드라이브 폴더 (링크 또는 ID)</span><input name="folderId" value="${esc(c.folderId || '')}"></label>
      <label class="f" style="grid-column:span 2"><span>Canva 템플릿</span><input name="template" value="${esc(c.template || '')}"></label>
    </div>
    <div class="grid g2" style="margin-top:12px">${RULES.map(([k, label, ph]) => `<label class="f"><span>${label}</span><textarea name="r_${k}" rows="${k === 'background' ? 2 : 5}" placeholder="${esc(ph)}">${esc(r[k] || '')}</textarea></label>`).join('')}</div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="b sm" data-cancel>취소</button><button class="b sm pri" data-save>저장</button></div>
  </div>`;
}

/* 직원 */
function staffView(el, root) {
  const names = ST.clients.map(c => c.name);
  el.innerHTML = `<div class="toolbar"><span class="muted">구글 계정으로 로그인합니다. 담당 고객사만 보이고, 관리자는 삭제·설정을 할 수 있습니다.</span><div class="sp"></div><button class="b sm" id="s-new">+ 직원</button></div>
    <div class="jobs">${ST.staff.map(s => `<div class="lrow" data-s="${esc(s.email)}"><span class="av">${esc(String(s.name || '?').slice(0, 1))}</span><b>${esc(s.name)}</b><span class="muted">${esc(s.email)}</span>
      <span class="muted">${s.all ? '전체 고객사' : (s.clients || []).map(n => esc(ST.clients.find(c => c.name === n)?.short || n)).join(', ') || '없음'}</span>
      <span class="pill" data-s="${s.active === false ? '보류' : '발행 완료'}">${s.active === false ? '정지' : s.admin ? '관리자' : '직원'}</span></div>
      ${ST.open === s.email ? staffForm(s, names) : ''}`).join('')}${ST.open === '__new' ? staffForm({ email: '', name: '', active: true, clients: [] }, names) : ''}</div>`;
  $('#s-new', el).onclick = () => { ST.open = '__new'; paint(root); };
  $$('[data-s]', el).forEach(r => { if (r.classList.contains('lrow')) r.onclick = () => { ST.open = ST.open === r.dataset.s ? null : r.dataset.s; paint(root); }; });
  const f = $('.sform', el); if (!f) return;
  const allBox = f.querySelector('[name="all"]'), sync = () => f.querySelector('.cl').style.opacity = allBox.checked ? .4 : 1; allBox.onchange = sync; sync();
  f.querySelector('[data-cancel]').onclick = () => { ST.open = null; paint(root); };
  const del = f.querySelector('[data-del]');
  if (del) del.onclick = async () => { if (!confirm('이 직원을 지울까요? 바로 로그인할 수 없게 됩니다.')) return; try { await A().deleteStaff(f.dataset.id); ST.open = null; render(root); } catch (e) { toast(e.message, true); } };
  f.querySelector('[data-save]').onclick = async () => {
    const v = n => f.querySelector(`[name="${n}"]`);
    const s = { email: v('email').value, name: v('name').value.trim(), admin: v('admin').checked, active: v('active').checked, all: allBox.checked,
      clients: $$('[name="cl"]:checked', f).map(x => x.value) };
    try { await A().saveStaff(s); toast('저장했습니다'); ST.open = null; render(root); } catch (e) { toast(e.message, true); }
  };
}
function staffForm(s, names) {
  return `<div class="sform" data-id="${esc(s.email)}" onclick="event.stopPropagation()">
    <div class="grid g4">
      <label class="f" style="grid-column:span 2"><span>구글 계정 이메일</span><input name="email" value="${esc(s.email)}" ${s.email ? 'readonly' : ''} placeholder="name@gmail.com"></label>
      <label class="f"><span>이름</span><input name="name" value="${esc(s.name)}"></label>
      <div class="f"><span>권한</span><div class="row" style="height:32px;gap:12px"><label class="row"><input type="checkbox" name="admin" ${s.admin ? 'checked' : ''}> 관리자</label><label class="row"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}> 사용</label></div></div>
    </div>
    <div class="f" style="margin-top:12px"><span>담당 고객사</span>
      <label class="row" style="margin:4px 0"><input type="checkbox" name="all" ${s.all ? 'checked' : ''}> 전체 (새 고객사도 자동 포함)</label>
      <div class="row cl" style="gap:6px">${names.map(n => `<label class="tag"><input type="checkbox" name="cl" value="${esc(n)}" ${(s.clients || []).includes(n) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div></div>
    <div class="row" style="margin-top:12px">${s.email ? '<button class="b sm ghost danger" data-del>삭제</button>' : ''}<div class="sp"></div><button class="b sm" data-cancel>취소</button><button class="b sm pri" data-save>저장</button></div>
  </div>`;
}

/* API 키 (포포봇 · 로컬 대시보드 동기화) */
function keysView(el, root) {
  el.innerHTML = `<div class="toolbar"><span class="muted">봇이나 다른 프로그램이 일정을 읽거나 구독사·월간 입력을 내려받을 때 씁니다. 키는 만들 때 한 번만 보입니다.</span><div class="sp"></div><button class="b sm" id="k-new">+ 키 만들기</button></div>
    <div id="k-made"></div>
    <div class="jobs">${ST.keys.length ? ST.keys.map(k => `<div class="lrow" style="cursor:default"><b>${esc(k.name)}</b><span class="muted">…${esc(k.tail || '')}</span><span class="muted">${esc((k.scopes || []).join(', '))}</span>
      <span class="muted">${k.all ? '전체 고객사' : esc((k.clients || []).join(', '))}</span><button class="b sm ghost danger" data-rv="${esc(k.id)}">폐기</button></div>`).join('') : '<div class="empty-box">아직 만든 키가 없습니다.</div>'}</div>
    ${ST.open === '__new' ? `<div class="sform" style="margin-top:10px"><div class="grid g3">
      <label class="f"><span>이름</span><input name="kname" placeholder="예: 포포봇"></label>
      <div class="f"><span>할 수 있는 일</span><div class="row" style="height:32px;gap:12px"><label class="row"><input type="checkbox" name="sc" value="jobs" checked> 일정 읽기</label><label class="row"><input type="checkbox" name="sc" value="export"> 구독사·월간 입력</label></div></div>
      <div class="f"><span>고객사</span><select name="kcl"><option value="__all">전체</option>${ST.clients.map(c => `<option>${esc(c.name)}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="b sm" data-cancel>취소</button><button class="b sm pri" data-save>만들기</button></div></div>` : ''}`;
  $('#k-new', el).onclick = () => { ST.open = '__new'; paint(root); };
  $$('[data-rv]', el).forEach(b => b.onclick = async () => { if (!confirm('이 키를 폐기할까요? 쓰던 프로그램은 바로 막힙니다.')) return; await A().revokeKey(b.dataset.rv); render(root); });
  const f = $('.sform', el); if (!f) return;
  f.querySelector('[data-cancel]').onclick = () => { ST.open = null; paint(root); };
  f.querySelector('[data-save]').onclick = async () => {
    const cl = f.querySelector('[name="kcl"]').value;
    try {
      const raw = await A().createKey({ name: f.querySelector('[name="kname"]').value.trim(), scopes: $$('[name="sc"]:checked', f).map(x => x.value), all: cl === '__all', clients: cl === '__all' ? [] : [cl] });
      ST.keys = await A().keys(); ST.open = null; paint(root);
      $('#k-made').innerHTML = `<div class="note good" style="margin-bottom:10px">새 키입니다. 지금 복사해 두세요. 다시 볼 수 없습니다.<br><code style="user-select:all;font-size:12px">${esc(raw)}</code></div>`;
    } catch (e) { toast(e.message, true); }
  };
}

window.RTSettings = { render };
})();
</script>
</body>
</html>
