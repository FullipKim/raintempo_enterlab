<style>
:root{
  --page:#f6f6f3;--surface:#ffffff;--sunken:#f0efeb;--ink:#111111;--ink2:#4a4945;--muted:#86847e;
  --line:#e4e2dc;--line2:#d4d2ca;--accent:#1f5fd1;--accent-soft:#e8f0fd;
  --good:#0f7a3a;--good-soft:#e6f4ea;--warn:#a15c00;--warn-soft:#fdf3e1;--bad:#c23030;--bad-soft:#fbeaea;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

/* 버튼 */
.b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.b:hover{background:var(--sunken)}
.b:disabled{opacity:.45;cursor:default}
.b.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.pri:hover{background:#333}
.b.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.b.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.b.ghost{border-color:transparent;background:transparent}
.b.ghost:hover{background:var(--sunken)}
.b.danger{color:var(--bad)}
.b .k{font-size:11px;color:var(--muted);font-weight:500}

/* 입력 */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--ink2)}
.f>small{font-size:12px;color:var(--muted)}
input:not([type]),input[type=text],input[type=url],input[type=date],input[type=time],input[type=datetime-local],input[type=password],input[type=month],select,textarea{
  width:100%;height:38px;padding:0 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:none}
textarea{height:auto;min-height:90px;padding:10px 11px;resize:vertical;line-height:1.7}
textarea.big{min-height:360px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}

/* 레이아웃 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,246,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:block}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.sp{flex:1}
.who{font-size:13px;color:var(--ink2)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.card h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* 칩·배지 */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.chip.c0{background:#e9effb;color:#1f4fa8}.chip.c1{background:#fbeee4;color:#9a4a12}.chip.c2{background:#e7f4ee;color:#16683f}.chip.c3{background:#f1e9f9;color:#6a3aa0}.chip.c4{background:#f9e8ee;color:#a2335a}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:#fff;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="원고 작성"]::before{background:var(--accent)}
.pill[data-s="이미지 리서치"]::before{background:#8a4fd8}
.pill[data-s="디자인 편집"]::before{background:#d0761b}
.pill[data-s="발행 준비"]::before{background:var(--warn)}
.pill[data-s="발행 완료"]{background:var(--good-soft);border-color:#bfe3cb;color:var(--good)}
.pill[data-s="발행 완료"]::before{background:var(--good)}
.pill[data-s="보류"]{color:var(--muted)}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 알림 */
.note{border-radius:10px;padding:11px 14px;font-size:13px;background:var(--accent-soft);color:#1a4a9e;line-height:1.6}
.note.warn{background:var(--warn-soft);color:#7a4600}
.note.bad{background:var(--bad-soft);color:#962323}
.note.good{background:var(--good-soft);color:#115c2f}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#111;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:100;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad)}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:380px;padding:34px 28px}
#login h1{font-size:21px;letter-spacing:-.02em;margin:18px 0 6px}

/* 보드 */
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.stat b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stat.alert b{color:var(--bad)}
@media(max-width:760px){.today{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:13px;color:var(--ink2);padding:0 4px 6px}
.day-h.today-h{color:var(--accent)}
.day-h.past{color:var(--bad)}
.jobs{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.job{display:grid;grid-template-columns:64px 1fr 104px 56px 96px;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.job:first-child{border-top:0}
.job:hover{background:#fafaf8}
.job .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .t.empty{color:var(--muted);font-weight:500}
.job .o{font-size:12px;color:var(--muted);text-align:right}
.job>div:last-child{text-align:right}
.steps{display:flex;gap:4px}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--good)}
@media(max-width:760px){.job{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:12px}.job .steps,.job .o{display:none}.who{display:none}.top-in{padding:10px 14px}main{padding:16px 14px 100px}}
.empty-box{padding:40px 20px;text-align:center;color:var(--muted)}

/* 작업 화면 */
#conflict:not(:empty){position:sticky;top:60px;z-index:15}
.jhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.jhead .title-in{flex:1;min-width:240px;height:44px;font-size:19px;font-weight:800;letter-spacing:-.02em;border-color:transparent;background:transparent;padding:0 8px}
.jhead .title-in:hover{border-color:var(--line2)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.dirty{color:var(--warn)}
.save.err{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{position:relative;height:42px;padding:0 16px;border:0;background:none;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button .n{width:20px;height:20px;border-radius:50%;background:var(--sunken);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tabs button.done .n{background:var(--good);color:#fff}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.side{position:sticky;top:72px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static}}
.check-list{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px}
.check-list li{display:flex;gap:8px;align-items:flex-start}
.check-list li::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:2px solid var(--line2)}
.check-list li.ok::before{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 2px #fff}
.check-list li.no{color:var(--ink)}
.check-list li.opt{color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-weight:500}
.lint{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lint div{font-size:13px;padding:8px 11px;border-radius:8px;background:var(--warn-soft);color:#7a4600}
.lint div.ok{background:var(--good-soft);color:var(--good)}
.lint mark{background:rgba(161,92,0,.15);color:inherit;border-radius:3px;padding:0 2px}
details.fold{border:1px solid var(--line);border-radius:10px;background:#fcfcfa}
details.fold>summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::before{content:"▸";color:var(--muted);transition:.15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>div{padding:0 14px 14px}
.ai-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.ai-steps>div{background:var(--sunken);border-radius:10px;padding:10px 12px;font-size:13px}
.ai-steps b{display:block;font-size:12px;color:var(--muted)}
@media(max-width:760px){.ai-steps{grid-template-columns:1fr}}

/* 이미지 */
.plan{width:100%;border-collapse:separate;border-spacing:0}
.plan th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:0 6px 6px}
.plan td{padding:4px 3px;vertical-align:top}
.plan td:first-child{width:34px;text-align:center;font-weight:800;color:var(--muted);padding-top:12px}
.plan input,.plan textarea{height:36px;min-height:36px;font-size:13px}
.plan textarea{padding:8px 10px;line-height:1.45;height:auto;min-height:0;resize:vertical}
.plan .x{width:34px}
@media(max-width:760px){.plan thead{display:none}.plan tr{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:8px 0;border-top:1px solid var(--line)}.plan td:nth-child(n+4){grid-column:2/-1}}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);cursor:pointer;background:#fcfcfa;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:15px;margin-bottom:3px;color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.thumb .im{aspect-ratio:4/5;background:var(--sunken) center/contain no-repeat;position:relative}
.thumb .im span{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:1px 7px}
.thumb .meta{padding:8px 9px;font-size:12px;color:var(--ink2);min-height:44px}
.thumb .act{display:flex;border-top:1px solid var(--line)}
.thumb .act button{flex:1;height:30px;border:0;background:none;cursor:pointer;font-size:13px}
.thumb .act button:hover{background:var(--sunken)}
.thumb .act button+button{border-left:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}

/* 발행 */
iframe.preview{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.copyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.copyrow .b{height:auto;padding:14px;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;white-space:normal}
.copyrow .b span{font-size:12px;color:var(--muted);font-weight:500}
.copyrow .b.pri span{color:#bbb}
@media(max-width:760px){.copyrow{grid-template-columns:1fr}}

/* 대화상자 */
dialog{margin:auto;border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,20,.35)}
dialog .dh{padding:18px 20px 0;font-size:17px;font-weight:800}
dialog .db{padding:14px 20px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.wd{display:flex;gap:4px}
.wd label{display:flex}
.wd input{display:none}
.wd span{width:36px;height:34px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:13px}
.wd input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.bulk-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bulk-list>div{display:grid;grid-template-columns:120px 1fr 30px;gap:6px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--muted)}
/* 카드 만들기 */
.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.cd{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.cd-h{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:6px}
.cd-lay{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:130px}
.cd-logo{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted,#666);cursor:pointer;white-space:nowrap}
.cd-logo input{margin:0}
.cd-c{position:relative;border-radius:8px;overflow:hidden;background:#111;aspect-ratio:1/1}
.cd-c canvas{width:100%;height:100%;display:block;touch-action:none}
.cd-c.has canvas{cursor:grab}
.cd-c.over{outline:3px solid var(--accent);outline-offset:-3px}
.cd-drop{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;pointer-events:none}
.cd-c.has .cd-drop{display:none}
.cd-t{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:30px}
.cd-t input[type=range]{flex:1;min-width:0}
</style>
